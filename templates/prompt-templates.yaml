templates:
  example-greeting:
    title: Example Greeting Template
    category: custom
    tags:
    - example
    - getting-started
    description: A simple greeting template demonstrating Handlebars syntax.
    engine: handlebars
    variables:
    - name: name
      description: Name of the person to greet
      required: true
      example: Alice
    - name: role
      description: Role or title of the person
      required: false
      defaultValue: developer
    content: 'Hello, {{name}}!

      {{#if role}}You are a {{role}}.{{/if}}

      Welcome to the MCP Server template system.

      '
  example-agent-briefing:
    title: Agent Briefing Template
    category: agent
    tags:
    - agent
    - onboarding
    - example
    description: Template for briefing an AI agent about a workspace context.
    engine: handlebars
    variables:
    - name: agentName
      description: Name of the AI agent
      required: true
      example: Copilot
    - name: workspaceName
      description: Name of the current workspace
      required: true
      example: McpServer
    - name: objectives
      description: List of objectives for the agent
      required: false
    content: '## Agent Briefing: {{agentName}}


      You are operating in the **{{workspaceName}}** workspace.


      {{#if objectives}}

      ### Objectives

      {{#each objectives}}

      - {{this}}

      {{/each}}

      {{else}}

      No specific objectives have been set. Await instructions.

      {{/if}}


      Please follow all workspace conventions and log your actions.

      '
  todo-status-prompt:
    title: TODO Status Prompt
    category: system
    tags:
    - todo
    - prompt
    - status
    description: 'Prompt template for generating TODO status reports. Placeholders: {id}, {title}, {baseUrl}.'
    engine: none
    variables:
    - name: id
      description: TODO item ID
      required: true
      example: MVP-MCP-004
    - name: title
      description: TODO item title
      required: false
    - name: baseUrl
      description: Server base URL
      required: false
      default-value: http://localhost:7147
    content: 'Get the current status of TODO {id}. Report the following in structured markdown:


      - Title, priority, section, done status

      - Description and technical details

      - Implementation task completion progress (count done vs total)

      - Any blockers or next steps

      - Dependencies and their current status

      '
  todo-implement-prompt:
    title: TODO Implement Prompt
    category: system
    tags:
    - todo
    - prompt
    - implement
    description: 'Prompt template for driving Copilot to implement a TODO item. Placeholders: {id}, {title}, {baseUrl}.'
    engine: none
    variables:
    - name: id
      description: TODO item ID
      required: true
      example: MVP-MCP-004
    - name: title
      description: TODO item title
      required: true
    - name: baseUrl
      description: Server base URL
      required: true
      default-value: http://localhost:7147
    content: "Implement TODO {id}: {title}\n\nFollow this procedure:\n\n1. IMPLEMENT TASKS: Work through each implementation\
      \ task that is not yet done.\n   After completing each task, immediately update the TODO via:\n   curl -X PUT {baseUrl}/mcpserver/todo/{id}\
      \ \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\"implementationTasks\": [ ...full array with updated\
      \ done flags... ]}'\n   This makes progress visible in real time.\n\n2. UPDATE DEPENDENTS: After all tasks are complete,\
      \ query all TODOs:\n   curl {baseUrl}/mcpserver/todo\n   Find any TODO whose dependsOn array contains \"{id}\". For\
      \ each dependent:\n   - Update its technicalDetails or note to reflect that {id} is now complete.\n   - If all of the\
      \ dependent's own dependencies are satisfied, update its\n     remaining estimate and note accordingly.\n\n3. MARK DONE:\
      \ When all implementationTasks are done, mark the TODO itself done:\n   curl -X PUT {baseUrl}/mcpserver/todo/{id} \\\
      \n     -H \"Content-Type: application/json\" \\\n     -d '{\"done\": true}'\n\n4. Update the session log throughout.\
      \ Run to completion, do not wait for user.\n"
  todo-plan-prompt:
    title: TODO Plan Prompt
    category: system
    tags:
    - todo
    - prompt
    - plan
    description: 'Prompt template for creating detailed implementation plans. Placeholders: {id}, {title}, {baseUrl}.'
    engine: none
    variables:
    - name: id
      description: TODO item ID
      required: true
      example: MVP-MCP-004
    - name: title
      description: TODO item title
      required: false
    - name: baseUrl
      description: Server base URL
      required: true
      default-value: http://localhost:7147
    content: "Create an implementation plan in excruciating detail as a new TODO that TODO {id} depends on.\n\n1. Analyze\
      \ the TODO item below and break it into granular, actionable implementation tasks.\n   Each task should be small enough\
      \ to complete in a single focused session.\n   Include file paths, class names, method signatures, test scenarios, and\
      \ integration points.\n\n2. Create a new TODO via:\n   POST {baseUrl}/mcpserver/todo\n   with the detailed plan as the\
      \ body (id, title, section, priority, description,\n   technicalDetails, implementationTasks).\n\n3. Update {id} via\
      \ PUT {baseUrl}/mcpserver/todo/{id}\n   to add the new plan TODO as a dependency in its dependsOn array.\n\nFinally,\
      \ update the todo with the plan.\n"
