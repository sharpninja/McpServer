templates:
  example-greeting:
    title: Example Greeting Template
    category: custom
    tags:
      - example
      - getting-started
    description: A simple greeting template demonstrating Handlebars syntax.
    engine: handlebars
    variables:
      - name: name
        description: Name of the person to greet
        required: true
        example: Alice
      - name: role
        description: Role or title of the person
        required: false
        defaultValue: developer
    content: |
      Hello, {{name}}!
      {{#if role}}You are a {{role}}.{{/if}}
      Welcome to the MCP Server template system.
  example-agent-briefing:
    title: Agent Briefing Template
    category: agent
    tags:
      - agent
      - onboarding
      - example
    description: Template for briefing an AI agent about a workspace context.
    engine: handlebars
    variables:
      - name: agentName
        description: Name of the AI agent
        required: true
        example: Copilot
      - name: workspaceName
        description: Name of the current workspace
        required: true
        example: McpServer
      - name: objectives
        description: List of objectives for the agent
        required: false
    content: |
      ## Agent Briefing: {{agentName}}

      You are operating in the **{{workspaceName}}** workspace.

      {{#if objectives}}
      ### Objectives
      {{#each objectives}}
      - {{this}}
      {{/each}}
      {{else}}
      No specific objectives have been set. Await instructions.
      {{/if}}

      Please follow all workspace conventions and log your actions.
  triage-research-bug-report:
    title: Triage Research Bug Report
    category: system
    tags:
      - triage
      - bug
      - research
    description: Prompt for the configured direct triage agent that researches grouped incidental bug reports and returns schema-valid JSON.
    engine: handlebars
    variables:
      - name: groupJson
        description: Serialized triage group detail including reports.
        required: true
      - name: groupId
        description: Triage group identifier.
        required: false
      - name: workspacePath
        description: Effective workspace path for the group.
        required: false
      - name: reportCount
        description: Number of reports currently in the group.
        required: false
    content: |-
      You are the configured MCP Server bug triage agent.

      Background triage is not a normal workspace session. You are doing bounded read-only research for an already accepted triage group.

      Use the supplied Group JSON as the primary source. Inspect repository files only when the report identifies a specific path, endpoint, method, or command that must be checked to make a defensible triage determination.

      Do not read AGENTS-README-FIRST.yaml, AGENTS.md, plugin skills, session history, marker files, or workspace operating instructions unless the report itself says one of those files is the failing artifact.

      Do not start or update MCP session logs, marker state, TODOs, requirements, GitHub issues, branches, commits, or MCP state. Do not create or update TODOs, requirements, GitHub issues, branches, commits, or MCP state.

      Do not run broad recursive repository searches. If file inspection is required, prefer targeted reads of the named files or symbols and stop as soon as the acceptance criteria and implementation notes are supported.

      Return only the JSON object as soon as you can make a defensible triage determination. Do not wait for perfect certainty and do not continue into remediation.

      Research the grouped incidental bug reports below. Return only schema-valid JSON with this shape:

      {
        "title": "short actionable bug title",
        "summary": "concise researched summary",
        "severity": "critical|high|medium|low",
        "acceptanceCriteria": ["observable criterion"],
        "implementationNotes": ["optional implementation note"]
      }

      Do not create TODOs yourself. Do not include markdown or prose outside the JSON object.

      Group id: {{groupId}}
      Workspace: {{workspacePath}}
      Report count: {{reportCount}}

      Group JSON:
      {{{groupJson}}}
  todo-status-prompt:
    title: TODO Status Prompt
    category: system
    tags:
      - todo
      - prompt
      - status
    description: 'Prompt template for generating TODO status reports. Placeholders: {id}, {title}, {baseUrl}.'
    engine: none
    variables:
      - name: id
        description: TODO item ID
        required: true
        example: MVP-MCP-004
      - name: title
        description: TODO item title
        required: false
      - name: baseUrl
        description: Server base URL
        required: false
        default-value: http://localhost:7147
    content: |
      Get the current status of TODO {id}. Report the following in structured markdown:

      - Title, priority, section, done status
      - Description and technical details
      - Implementation task completion progress (count done vs total)
      - Any blockers or next steps
      - Dependencies and their current status
  todo-implement-prompt:
    title: TODO Implement Prompt
    category: system
    tags:
      - todo
      - prompt
      - implement
    description: 'Prompt template for driving Copilot to implement a TODO item. Placeholders: {id}, {title}, {baseUrl}.'
    engine: none
    variables:
      - name: id
        description: TODO item ID
        required: true
        example: MVP-MCP-004
      - name: title
        description: TODO item title
        required: true
      - name: baseUrl
        description: Server base URL
        required: true
        default-value: http://localhost:7147
    content: |
      Implement TODO {id}: {title}

      Follow this procedure:

      1. IMPLEMENT TASKS: Work through each implementation task that is not yet done.
         After completing each task, immediately update the TODO via:
         curl -X PUT {baseUrl}/mcpserver/todo/{id} \
           -H "Content-Type: application/json" \
           -d '{"implementationTasks": [ ...full array with updated done flags... ]}'
         This makes progress visible in real time.

      2. UPDATE DEPENDENTS: After all tasks are complete, query all TODOs:
         curl {baseUrl}/mcpserver/todo
         Find any TODO whose dependsOn array contains "{id}". For each dependent:
         - Update its technicalDetails or note to reflect that {id} is now complete.
         - If all of the dependent's own dependencies are satisfied, update its
           remaining estimate and note accordingly.

      3. MARK DONE: When all implementationTasks are done, mark the TODO itself done:
         curl -X PUT {baseUrl}/mcpserver/todo/{id} \
           -H "Content-Type: application/json" \
           -d '{"done": true}'

      4. Update the session log throughout. Run to completion, do not wait for user.
  todo-plan-prompt:
    title: TODO Plan Prompt
    category: system
    tags:
      - todo
      - prompt
      - plan
    description: 'Prompt template for creating detailed implementation plans. Placeholders: {id}, {title}, {baseUrl}.'
    engine: none
    variables:
      - name: id
        description: TODO item ID
        required: true
        example: MVP-MCP-004
      - name: title
        description: TODO item title
        required: false
      - name: baseUrl
        description: Server base URL
        required: true
        default-value: http://localhost:7147
    content: |
      Create an implementation plan in excruciating detail as a new TODO that TODO {id} depends on.

      1. Analyze the TODO item below and break it into granular, actionable implementation tasks.
         Each task should be small enough to complete in a single focused session.
         Include file paths, class names, method signatures, test scenarios, and integration points.

      2. Create a new TODO via:
         POST {baseUrl}/mcpserver/todo
         with the detailed plan as the body (id, title, section, priority, description,
         technicalDetails, implementationTasks).

      3. Update {id} via PUT {baseUrl}/mcpserver/todo/{id}
         to add the new plan TODO as a dependency in its dependsOn array.

      Finally, update the todo with the plan.
  pairing-login-page:
    title: Pairing Login Page
    category: system
    tags:
      - pairing
      - html
      - login
    description: 'HTML template for the /pair login form. Placeholder: {errorBanner} (empty string or error div).'
    engine: none
    variables:
      - name: errorBanner
        description: HTML error banner string (empty for no error)
        required: false
        default-value: ""
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>MCP Server — Pair</title>
        <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
          .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:32px;width:100%;max-width:380px}
          h1{font-size:1.3rem;margin-bottom:4px;color:#111}
          .sub{font-size:.85rem;color:#666;margin-bottom:20px}
          label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px;color:#333}
          input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:.95rem;margin-bottom:14px}
          input:focus{outline:none;border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.15)}
          button{width:100%;padding:10px;background:#0969da;color:#fff;border:none;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer}
          button:hover{background:#0860c4}
        </style>
      </head>
      <body>
        <div class="card">
          <h1>🔗 MCP Server Pairing</h1>
          <p class="sub">Sign in to view your API key.</p>
          {errorBanner}
          <form method="post" action="/pair">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required/>
            <button type="submit">Sign In</button>
          </form>
        </div>
      </body>
      </html>
  pairing-key-page:
    title: Pairing Key Page
    category: system
    tags:
      - pairing
      - html
      - apikey
    description: 'HTML template showing the API key after login. Placeholders: {apiKey}, {serverUrl}.'
    engine: none
    variables:
      - name: apiKey
        description: The server API key to display
        required: true
      - name: serverUrl
        description: The server base URL
        required: true
        example: http://localhost:7147
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>MCP Server — API Key</title>
        <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
          .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:32px;width:100%;max-width:480px}
          h1{font-size:1.3rem;margin-bottom:4px;color:#111}
          .sub{font-size:.85rem;color:#666;margin-bottom:20px}
          .key-box{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:14px 16px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.95rem;word-break:break-all;margin-bottom:16px;position:relative}
          .copy-btn{position:absolute;top:8px;right:8px;background:#0969da;color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:.8rem;cursor:pointer}
          .copy-btn:hover{background:#0860c4}
          .qr-section{text-align:center;margin-bottom:20px}
          .qr-section h2{font-size:1rem;margin-bottom:12px;color:#333}
          .qr-section img{display:inline-block;padding:12px;background:#fff;border:1px solid #d0d7de;border-radius:8px;width:256px;height:256px}
          .section{margin-bottom:20px}
          .section h2{font-size:1rem;margin-bottom:8px;color:#333}
          pre{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:14px 16px;font-size:.82rem;overflow-x:auto;line-height:1.5}
          .warn{font-size:.8rem;color:#888;margin-top:12px}
        </style>
      </head>
      <body>
        <div class="card">
          <h1>🔑 Your API Key</h1>
          <p class="sub">Scan the QR code with the MCP Server mobile app, or copy the key below.</p>
          <div class="qr-section">
            <h2>📱 Scan to Pair</h2>
            <img src="/pair/qr" alt="QR code for pairing"/>
          </div>
          <div class="key-box">
            <span id="key">{apiKey}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('key').textContent)">Copy</button>
          </div>
          <div class="section">
            <h2>MCP Client Config</h2>
            <pre>{
        "mcpServers": {
          "mcp-server": {
            "url": "{serverUrl}/mcp-transport"
          }
        }
      }</pre>
          </div>
          <div class="section">
            <h2>cURL Example</h2>
            <pre>curl {serverUrl}/mcpserver/workspace \
        -H "X-Api-Key: {apiKey}"</pre>
          </div>
          <p class="warn">Keep this key secret. It grants write access to workspace and tool endpoints.</p>
        </div>
      </body>
      </html>
  pairing-not-configured-page:
    title: Pairing Not Configured Page
    category: system
    tags:
      - pairing
      - html
      - error
    description: HTML template shown when pairing is not configured. No placeholders.
    engine: none
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>MCP Server — Pairing Not Configured</title>
        <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
          .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:32px;width:100%;max-width:380px;text-align:center}
          h1{font-size:1.3rem;margin-bottom:12px;color:#111}
          p{color:#666;font-size:.9rem;line-height:1.5}
          code{background:#f6f8fa;padding:2px 6px;border-radius:4px;font-size:.85rem}
        </style>
      </head>
      <body>
        <div class="card">
          <h1>⚠️ Pairing Not Configured</h1>
