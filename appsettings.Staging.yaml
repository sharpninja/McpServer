Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      McpServer.Support.Mcp.Logging: Verbose

Mcp:
  Port: 7147
  DataSource: mcp.db
  DataDirectory: "."
  RepoRoot: "."
  TodoFilePath: docs/Project/TODO.yaml
  TodoStorage:
    Provider: yaml
    SqliteDataSource: mcp.db
  Workspaces:
    - WorkspacePath: E:\github\McpServer
      Name: McpServer
      TodoPath: docs/Project/TODO.yaml
      DateTimeCreated: "2026-02-21T00:00:00+00:00"
      DateTimeModified: "2026-02-23T00:00:00+00:00"
  Instances:
    default:
      Port: 7147
      DataSource: mcp.db
      DataDirectory: "."
      RepoRoot: "."
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: yaml
        SqliteDataSource: mcp.db
    alt-local:
      Port: 7157
      DataSource: mcp-alt.db
      DataDirectory: "."
      RepoRoot: docs
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp-alt.db
  InteractionLogging:
    LoggingServiceUrl: ""
    QueueCapacity: 1000
    IncludeQueryString: false
  Parseable:
    Url: http://localhost:8000
    StreamName: mcp
