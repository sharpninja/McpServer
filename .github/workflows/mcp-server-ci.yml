name: mcp-server-ci

permissions:
  contents: write
  actions: write
  packages: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/McpServer.Support.Mcp/**"
      - "src/McpServer.Client/**"
      - "src/McpServer.Director/**"
      - "src/McpServer.UI.Core/**"
      - "src/McpServer.Cqrs/**"
      - "src/McpServer.Cqrs.Mvvm/**"
      - "src/McpServer.Web/**"
      - "tests/McpServer.Support.Mcp.Tests/**"
      - "tests/McpServer.Client.Tests/**"
      - "tests/McpServer.Cqrs.Tests/**"
      - "docs/**"
      - "docfx.json"
      - "templates/**"
      - "index.md"
      - "toc.yml"
      - "README.md"
      - "scripts/Start-McpServer.ps1"
      - "scripts/Package-McpServerMsix.ps1"
      - "scripts/Migrate-McpTodoStorage.ps1"
      - "scripts/Test-McpMultiInstance.ps1"
      - ".github/workflows/mcp-server-ci.yml"
      - "GitVersion.yml"
  pull_request:
    paths:
      - "src/McpServer.Support.Mcp/**"
      - "src/McpServer.Client/**"
      - "src/McpServer.Director/**"
      - "src/McpServer.UI.Core/**"
      - "src/McpServer.Cqrs/**"
      - "src/McpServer.Cqrs.Mvvm/**"
      - "src/McpServer.Web/**"
      - "tests/McpServer.Support.Mcp.Tests/**"
      - "tests/McpServer.Client.Tests/**"
      - "tests/McpServer.Cqrs.Tests/**"
      - "docs/**"
      - "docfx.json"
      - "templates/**"
      - "index.md"
      - "toc.yml"
      - "README.md"
      - "scripts/Start-McpServer.ps1"
      - "scripts/Package-McpServerMsix.ps1"
      - "scripts/Migrate-McpTodoStorage.ps1"
      - "scripts/Test-McpMultiInstance.ps1"
      - ".github/workflows/mcp-server-ci.yml"
      - "GitVersion.yml"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj

      - name: Build
        run: dotnet build tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Install GitVersion CLI
        run: dotnet tool install --global GitVersion.Tool

      - name: Compute version from GitVersion
        id: version
        shell: pwsh
        run: |
          $gvJson = dotnet-gitversion /output json | Out-String
          $gv = $gvJson | ConvertFrom-Json
          if ('${{ github.ref }}' -eq 'refs/heads/main') {
            $version = $gv.MajorMinorPatch
          }
          else {
            $version = $gv.SemVer
          }
          Write-Host "GitVersion FullSemVer: $($gv.FullSemVer)"
          Write-Host "GitVersion SemVer: $($gv.SemVer)"
          Write-Host "PackageVersion: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append

      - name: Publish MCP Server
        run: dotnet publish src/McpServer.Support.Mcp/McpServer.Support.Mcp.csproj -c Release -o artifacts/mcp-server

      - name: Upload MCP publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-publish
          path: artifacts/mcp-server

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-test-results
          path: TestResults

  windows-msix:
    runs-on: windows-latest
    needs: build-test-publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package MSIX
        shell: pwsh
        run: |
          ./scripts/Package-McpServerMsix.ps1 -Configuration Release -Version 1.0.${{ github.run_number }}.0

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-msix
          path: artifacts/msix/*.msix

  release-main:
    runs-on: ubuntu-latest
    needs: [windows-msix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-server-msix
          path: artifacts/msix

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-server-v1.0.${{ github.run_number }}.0
          name: MCP Server v1.0.${{ github.run_number }}.0
          generate_release_notes: true
          files: artifacts/msix/*.msix

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md

      - name: Link check
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress docs README.md
          fail: false
          failIfEmpty: false

  docs-build:
    runs-on: ubuntu-latest
    needs: docs-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build documentation
        run: dotnet docfx docfx.json

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-docs
          path: _site

  docs-deploy:
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-server-docs
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-nuget:
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/McpServer.Client/McpServer.Client.csproj -c Release -p:PackageVersion=${{ needs.build-test-publish.outputs.package_version }} -o ./nupkg

      - name: Push to NuGet (main only)
        if: github.ref == 'refs/heads/main'
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Push to GitHub Packages (non-main)
        if: github.ref != 'refs/heads/main'
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-packages-nupkg
          path: nupkg/*.nupkg
