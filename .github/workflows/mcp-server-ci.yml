name: mcp-server-ci

permissions:
  contents: write
  actions: write
  packages: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/McpServer.Support.Mcp/**"
      - "src/McpServer.Client/**"
      - "tests/McpServer.Support.Mcp.Tests/**"
      - "tests/McpServer.Client.Tests/**"
      - "docs/**"
      - "scripts/Start-McpServer.ps1"
      - "scripts/Package-McpServerMsix.ps1"
      - "scripts/Migrate-McpTodoStorage.ps1"
      - "scripts/Validate-McpConfig.ps1"
      - "scripts/Test-McpMultiInstance.ps1"
      - ".github/workflows/mcp-server-ci.yml"
  pull_request:
    paths:
      - "src/McpServer.Support.Mcp/**"
      - "src/McpServer.Client/**"
      - "tests/McpServer.Support.Mcp.Tests/**"
      - "tests/McpServer.Client.Tests/**"
      - "docs/**"
      - "scripts/Start-McpServer.ps1"
      - "scripts/Package-McpServerMsix.ps1"
      - "scripts/Migrate-McpTodoStorage.ps1"
      - "scripts/Validate-McpConfig.ps1"
      - "scripts/Test-McpMultiInstance.ps1"
      - ".github/workflows/mcp-server-ci.yml"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj

      - name: Validate MCP config
        shell: pwsh
        run: ./scripts/Validate-McpConfig.ps1

      - name: Build
        run: dotnet build tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish MCP Server
        run: dotnet publish src/McpServer.Support.Mcp/McpServer.Support.Mcp.csproj -c Release -o artifacts/mcp-server

      - name: Generate OpenAPI artifact
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_ENVIRONMENT=Development
          dotnet artifacts/mcp-server/McpServer.Support.Mcp.dll > artifacts/mcp-server.log 2>&1 &
          MCP_PID=$!
          for i in {1..30}; do
            if curl -fsS http://localhost:7147/swagger/v1/swagger.json -o artifacts/swagger-v1.json; then
              break
            fi
            sleep 1
          done
          kill $MCP_PID || true
          wait $MCP_PID || true
          test -f artifacts/swagger-v1.json

      - name: Upload MCP publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-publish
          path: artifacts/mcp-server

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-openapi
          path: artifacts/swagger-v1.json

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-test-results
          path: TestResults

  windows-msix:
    runs-on: windows-latest
    needs: build-test-publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package MSIX
        shell: pwsh
        run: |
          ./scripts/Package-McpServerMsix.ps1 -Configuration Release -Version 1.0.${{ github.run_number }}.0

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-msix
          path: artifacts/msix/*.msix

  multi-instance-smoke:
    runs-on: windows-latest
    needs: build-test-publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run multi-instance smoke test
        shell: pwsh
        run: |
          ./scripts/Test-McpMultiInstance.ps1 -Configuration Staging -FirstInstance default -SecondInstance alt-local -TimeoutSeconds 180

  docker-smoke:
    runs-on: ubuntu-latest
    needs: build-test-publish
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mcp-server:ci .

      - name: Start container and health check
        run: |
          docker run -d --name mcp-ci -p 7147:7147 \
            -e Mcp__Port=7147 \
            -e Mcp__DataDirectory=/data \
            -e VectorIndex__IndexPath=/data/vector.idx \
            -e Embedding__Enabled=false \
            -e VectorIndex__Enabled=false \
            mcp-server:ci
          for i in {1..30}; do
            if curl -fsS http://localhost:7147/health; then
              echo "Health check passed"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:7147/health | grep -q Healthy

      - name: Test TODO endpoint
        run: curl -fsS http://localhost:7147/mcp/todo | head -c 200

      - name: Test Swagger
        run: curl -fsS http://localhost:7147/swagger/v1/swagger.json -o /dev/null

      - name: Cleanup
        if: always()
        run: docker stop mcp-ci && docker rm mcp-ci || true

  release-main:
    runs-on: ubuntu-latest
    needs: [windows-msix, multi-instance-smoke, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-server-msix
          path: artifacts/msix

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-server-v1.0.${{ github.run_number }}.0
          name: MCP Server v1.0.${{ github.run_number }}.0
          generate_release_notes: true
          files: artifacts/msix/*.msix

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress docs README.md
          fail: true
          failIfEmpty: false

  docs-build:
    runs-on: ubuntu-latest
    needs: docs-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build documentation
        run: dotnet docfx docfx.json

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-docs
          path: _site

  docs-deploy:
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-server-docs
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-nuget:
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(cat .version | LC_ALL=C tr -cd '0-9A-Za-z.\-' )
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$BASE_VERSION-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/McpServer.Client/McpServer.Client.csproj -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o ./nupkg

      - name: Push to NuGet (main only)
        if: github.ref == 'refs/heads/main'
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Push to GitHub Packages (non-main)
        if: github.ref != 'refs/heads/main'
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-client-nupkg
          path: nupkg/*.nupkg
