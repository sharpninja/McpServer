name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - src/**
      - tests/**
      - build/**
      - docs/**
      - scripts/Publish-RequirementsWiki.ps1
      - build.ps1
      - build.sh
      - '*.sln'
      - Directory.Build.props
      - Directory.Packages.props
      - GitVersion.yml
      - .github/workflows/build.yml
  pull_request:
    branches: [main, develop]
    paths:
      - src/**
      - tests/**
      - build/**
      - docs/**
      - scripts/Publish-RequirementsWiki.ps1
      - build.ps1
      - build.sh
      - '*.sln'
      - Directory.Build.props
      - Directory.Packages.props
      - GitVersion.yml
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compile
        run: ./build.ps1 Compile --configuration Release
        shell: pwsh

      - name: Test
        run: ./build.ps1 Test --configuration Release
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  validate:
    name: Validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate Config
        run: ./build.ps1 ValidateConfig
        shell: pwsh

      - name: Validate Traceability
        run: ./build.ps1 ValidateTraceability
        shell: pwsh

  package:
    name: Package
    needs: build-test
    runs-on: windows-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.package-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute package version
        id: package-version
        run: |
          $toolPath = Join-Path $HOME '.dotnet/tools'
          $env:PATH = "$toolPath$([IO.Path]::PathSeparator)$env:PATH"

          dotnet tool update --global GitVersion.Tool | Out-Host
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global GitVersion.Tool | Out-Host
          }

          $gvJson = dotnet-gitversion /output json | Out-String
          $gv = $gvJson | ConvertFrom-Json
          $isMain = '${{ github.ref }}' -eq 'refs/heads/main'
          $version = if ($isMain) { $gv.MajorMinorPatch } else { $gv.SemVer }

          Write-Host "GitVersion FullSemVer: $($gv.FullSemVer)"
          Write-Host "GitVersion SemVer: $($gv.SemVer)"
          Write-Host "PackageVersion: $version"
          "package-version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Pack NuGet
        run: ./build.ps1 PackNuGet --configuration Release --package-version "${{ steps.package-version.outputs.package-version }}"
        shell: pwsh

      - name: Pack REPL Tool
        run: ./build.ps1 PackReplTool --configuration Release
        shell: pwsh

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nupkg/*.nupkg

      - name: Push to NuGet (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ secrets.NuGetApiKey || secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Host "NuGetApiKey secret not set; skipping nuget.org publish."
            exit 0
          }

          $packages = Get-ChildItem -Path "${{ github.workspace }}/artifacts/nupkg" -Filter *.nupkg | Select-Object -ExpandProperty FullName
          foreach ($package in $packages) {
            dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $package"
            }
          }
        shell: pwsh

      - name: Upload REPL tool package
        uses: actions/upload-artifact@v4
        with:
          name: repl-tool-package
          path: local-packages/*.nupkg

  msix:
    name: MSIX Package
    needs: build-test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package MSIX
        run: ./build.ps1 PackageMsix --configuration Release
        shell: pwsh

      - name: Upload MSIX artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msix-package
          path: artifacts/msix/*.msix

  publish:
    name: Publish
    needs: build-test
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Server
        run: ./build.ps1 Publish --configuration Release
        shell: pwsh

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-publish
          path: artifacts/mcp-server/

  publish-wiki:
    name: Publish GitHub Wiki
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish GitHub requirements wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/Publish-RequirementsWiki.ps1 `
            -Target GitHub `
            -ExportZip "${{ github.workspace }}/docs/requirements/requirements-wiki-documents.zip" `
            -OutputPath "${{ runner.temp }}/requirements-wiki/github" `
            -RepositoryUrl "https://github.com/${{ github.repository }}.wiki.git" `
            -AuthToken $env:GITHUB_TOKEN `
            -UserDocsBranch "${{ github.ref_name }}" `
            -CommitMessage "Sync GitHub requirements wiki from ${{ github.sha }}" `
            -Push
        shell: pwsh
