Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      McpServer.Support.Mcp.Logging: Verbose

AllowedHosts: "*"

Embedding:
  Enabled: true
  Dimensions: 384
  MaxSequenceLength: 128
  AutoDownload: true

VectorIndex:
  Enabled: true
  Dimensions: 384
  MaxElements: 100000
  M: 16
  EfConstruction: 200
  EfSearch: 50
  IndexPath: mcp-data/vector.idx

Mcp:
  Port: 7147
  DataSource: mcp.db
  DataDirectory: "."
  RepoRoot: "."
  TodoFilePath: docs/Project/TODO.yaml
  SessionsPath: docs/sessions
  UnifiedModelSchemaPath: docs/schemas/UnifiedModel.schema.json
  ExternalDocsPath: docs/external
  TodoStorage:
    Provider: yaml
    SqliteDataSource: mcp.db
  Workspaces:
    - WorkspacePath: E:\github\McpServer
      Name: McpServer
      TodoPath: docs/Project/TODO.yaml
      DateTimeCreated: "2026-02-21T00:00:00+00:00"
      DateTimeModified: "2026-02-23T00:00:00+00:00"
  Instances:
    default:
      Port: 7147
      DataSource: mcp.db
      DataDirectory: "."
      RepoRoot: "."
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: yaml
        SqliteDataSource: mcp.db
    alt-local:
      Port: 7157
      DataSource: mcp-alt.db
      DataDirectory: "."
      RepoRoot: docs
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp-alt.db
  InteractionLogging:
    LoggingServiceUrl: ""
    QueueCapacity: 1000
    IncludeQueryString: false
  Parseable:
    Url: http://localhost:8000
    IngestUrl: http://localhost:8000/api/v1/ingest
    StreamName: mcp
    Username: admin
    Password: admin
    FallbackLogPath: logs/mcp-.log
  Auth:
    Authority: http://localhost:7080/realms/mcpserver
    Audience: mcp-server-api
    ClientSecret: ""
    RequireHttpsMetadata: false
