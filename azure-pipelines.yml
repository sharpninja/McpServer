name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/McpServer.Support.Mcp/**
      - src/McpServer.Client/**
      - src/McpServer.Director/**
      - src/McpServer.McpAgent/**
      - src/McpServer.Repl.Core/**
      - src/McpServer.UI.Core/**
      - src/McpServer.Cqrs/**
      - src/McpServer.Cqrs.Mvvm/**
      - src/McpServer.Web/**
      - tests/McpServer.Support.Mcp.Tests/**
      - tests/McpServer.Client.Tests/**
      - tests/McpServer.Cqrs.Tests/**
      - tests/Build.Tests/**
      - build/**
      - build.ps1
      - docs/**
      - docfx.json
      - templates/**
      - index.md
      - toc.yml
      - README.md
      - scripts/Start-McpServer.ps1
      - scripts/Package-McpServerMsix.ps1
      - scripts/Migrate-McpTodoStorage.ps1
      - scripts/Test-McpMultiInstance.ps1
      - scripts/Validate-McpConfig.ps1
      - azure-pipelines.yml
      - GitVersion.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/McpServer.Support.Mcp/**
      - src/McpServer.Client/**
      - src/McpServer.Director/**
      - src/McpServer.McpAgent/**
      - src/McpServer.Repl.Core/**
      - src/McpServer.UI.Core/**
      - src/McpServer.Cqrs/**
      - src/McpServer.Cqrs.Mvvm/**
      - src/McpServer.Web/**
      - tests/McpServer.Support.Mcp.Tests/**
      - tests/McpServer.Client.Tests/**
      - tests/McpServer.Cqrs.Tests/**
      - tests/Build.Tests/**
      - build/**
      - build.ps1
      - docs/**
      - docfx.json
      - templates/**
      - index.md
      - toc.yml
      - README.md
      - scripts/Start-McpServer.ps1
      - scripts/Package-McpServerMsix.ps1
      - scripts/Migrate-McpTodoStorage.ps1
      - scripts/Test-McpMultiInstance.ps1
      - scripts/Validate-McpConfig.ps1
      - azure-pipelines.yml
      - GitVersion.yml

variables:
  AgentPoolName: Default
  # Secrets required for shared module publishing (set these in the pipeline or variable group):
  #   - PSGalleryApiKey   (PowerShell Gallery API key)
  #   - NPM_API_KEY       (npm automation token for @sharpninja scope)
  BuildConfiguration: Release
  TestProject: tests/McpServer.Support.Mcp.Tests/McpServer.Support.Mcp.Tests.csproj
  ServerProject: src/McpServer.Support.Mcp/McpServer.Support.Mcp.csproj
  ClientProject: src/McpServer.Client/McpServer.Client.csproj
  PublishArtifactName: mcp-server-publish
  DocsArtifactName: mcp-server-docs
  MsixArtifactName: mcp-server-msix
  PackageArtifactName: mcp-packages-nupkg
  RequirementsWikiZip: docs/requirements/requirements-wiki-documents.zip
  AzureWikiRepositoryUrl: ''
  DocsAzureServiceConnection: ''
  DocsStorageAccount: ''
  AzureArtifactsFeedUrl: ''

jobs:
  - job: build_test_publish
    displayName: build-test-publish
    pool:
      name: $(AgentPoolName)
    steps:
      - checkout: self
        fetchDepth: 0

      - task: UseDotNet@2
        displayName: Setup .NET
        inputs:
          packageType: sdk
          useGlobalJson: true

      - task: PowerShell@2
        displayName: Validate config
        inputs:
          pwsh: true
          targetType: filePath
          filePath: build.ps1
          arguments: ValidateConfig

      - task: PowerShell@2
        displayName: Compile
        inputs:
          pwsh: true
          targetType: filePath
          filePath: build.ps1
          arguments: Compile --configuration $(BuildConfiguration)

      - task: PowerShell@2
        displayName: Test
        inputs:
          pwsh: true
          targetType: filePath
          filePath: build.ps1
          arguments: Test --configuration $(BuildConfiguration)

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: TestResults/**/*.trx
          failTaskOnFailedTests: true
          testRunTitle: McpServer.Support.Mcp.Tests ($(BuildConfiguration))

      - task: PowerShell@2
        displayName: Compute package version
        name: setPackageVersion
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $toolPath = Join-Path $HOME '.dotnet/tools'
            $env:PATH = "$toolPath$([IO.Path]::PathSeparator)$env:PATH"

            dotnet tool update --global GitVersion.Tool | Out-Host
            if ($LASTEXITCODE -ne 0) {
              dotnet tool install --global GitVersion.Tool | Out-Host
            }

            $gvJson = dotnet-gitversion /output json | Out-String
            $gv = $gvJson | ConvertFrom-Json
            $isMain = '$(Build.SourceBranch)' -eq 'refs/heads/main'
            $version = if ($isMain) { $gv.MajorMinorPatch } else { $gv.SemVer }

            Write-Host "GitVersion FullSemVer: $($gv.FullSemVer)"
            Write-Host "GitVersion SemVer: $($gv.SemVer)"
            Write-Host "PackageVersion: $version"
            Write-Host "##vso[task.setvariable variable=PackageVersion;isOutput=true]$version"

      - task: PowerShell@2
        displayName: Publish MCP Server
        inputs:
          pwsh: true
          targetType: filePath
          filePath: build.ps1
          arguments: Publish --configuration $(BuildConfiguration)

      - task: PublishPipelineArtifact@1
        displayName: Upload MCP publish artifact
        inputs:
          targetPath: $(Build.SourcesDirectory)/artifacts/mcp-server
          artifact: $(PublishArtifactName)

  - job: docs_quality
    displayName: docs-quality
    pool:
      name: $(AgentPoolName)
    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Setup Node.js
        inputs:
          versionSpec: 20.x

      - script: npx --yes markdownlint-cli2 "docs/**/*.md" "README.md"
        displayName: Markdown lint

      - task: PowerShell@2
        displayName: Link check
        continueOnError: true
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $config = Join-Path $env:BUILD_SOURCESDIRECTORY '.markdown-link-check.json'
            $wikiRoot = Join-Path $env:BUILD_SOURCESDIRECTORY 'docs/Project/wiki'
            npx --yes markdown-link-check --config $config --quiet README.md
            Get-ChildItem docs -Recurse -Filter *.md | Where-Object {
              -not $_.FullName.StartsWith($wikiRoot, [System.StringComparison]::OrdinalIgnoreCase)
            } | ForEach-Object {
              $file = $_.FullName
              npx --yes markdown-link-check --config $config --quiet $file
              if ($LASTEXITCODE -ne 0) {
                throw "markdown-link-check failed for $file"
              }
            }

  - job: docs_build
    displayName: docs-build
    dependsOn: docs_quality
    pool:
      name: $(AgentPoolName)
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: Setup .NET
        inputs:
          packageType: sdk
          useGlobalJson: true

      - script: dotnet tool restore
        displayName: Restore tools

      - script: dotnet docfx docfx.json
        displayName: Build documentation

      - task: PublishPipelineArtifact@1
        displayName: Upload docs artifact
        inputs:
          targetPath: $(Build.SourcesDirectory)/_site
          artifact: $(DocsArtifactName)

  - job: windows_msix
    displayName: windows-msix
    dependsOn: build_test_publish
    continueOnError: true
    pool:
      name: $(AgentPoolName)
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: Setup .NET
        inputs:
          packageType: sdk
          useGlobalJson: true

      - task: PowerShell@2
        displayName: Package MSIX
        inputs:
          pwsh: true
          targetType: filePath
          filePath: build.ps1
          arguments: PackageMsix --configuration $(BuildConfiguration) --msix-version 1.0.$(Build.BuildId).0

      - task: PublishPipelineArtifact@1
        displayName: Upload MSIX artifact
        condition: succeeded()
        inputs:
          targetPath: $(Build.SourcesDirectory)/artifacts/msix
          artifact: $(MsixArtifactName)

  - job: publish_packages
    displayName: publish-packages
    dependsOn: build_test_publish
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      name: $(AgentPoolName)
    variables:
      PackageVersion: $[ dependencies.build_test_publish.outputs['setPackageVersion.PackageVersion'] ]
    steps:
      - checkout: self
        fetchDepth: 0

      - task: UseDotNet@2
        displayName: Setup .NET
        inputs:
          packageType: sdk
          useGlobalJson: true

      - task: PowerShell@2
        displayName: Pack NuGet
        inputs:
          pwsh: true
          targetType: filePath
          filePath: build.ps1
          arguments: PackNuGet --configuration $(BuildConfiguration) --package-version $(PackageVersion)

      - task: NuGetAuthenticate@1
        displayName: Authenticate Azure Artifacts
        condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['AzureArtifactsFeedUrl'], ''))

      - task: PowerShell@2
        displayName: Push to NuGet (main only)
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        env:
          NUGET_API_KEY: $(NUGET_API_KEY)
          NUGET_API_KEY_ALT: $(NuGetApiKey)
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $apiKey = @($env:NUGET_API_KEY, $env:NUGET_API_KEY_ALT) |
              Where-Object {
                -not [string]::IsNullOrWhiteSpace($_) -and
                -not $_.StartsWith('$(', [System.StringComparison]::Ordinal)
              } |
              Select-Object -First 1

            if ([string]::IsNullOrWhiteSpace($apiKey)) {
              Write-Host "NUGET_API_KEY or NuGetApiKey pipeline secret not set; skipping nuget.org publish."
              exit 0
            }

            $packages = Get-ChildItem -Path "$(Build.SourcesDirectory)/artifacts/nupkg" -Filter *.nupkg | Select-Object -ExpandProperty FullName
            foreach ($package in $packages) {
              dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $apiKey --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                throw "dotnet nuget push failed for $package"
              }
            }

      - task: PowerShell@2
        displayName: Push to Azure Artifacts (non-main)
        condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
        env:
          AZURE_ARTIFACTS_FEED_URL: $(AzureArtifactsFeedUrl)
        inputs:
          pwsh: true
          targetType: inline
          script: |
            if ([string]::IsNullOrWhiteSpace($env:AZURE_ARTIFACTS_FEED_URL)) {
              Write-Host "AzureArtifactsFeedUrl not set; skipping Azure Artifacts publish."
              exit 0
            }

            $packages = Get-ChildItem -Path "$(Build.SourcesDirectory)/artifacts/nupkg" -Filter *.nupkg | Select-Object -ExpandProperty FullName
            foreach ($package in $packages) {
              dotnet nuget push $package --source $env:AZURE_ARTIFACTS_FEED_URL --api-key azdo --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                throw "dotnet nuget push failed for $package"
              }
            }

      - task: PublishPipelineArtifact@1
        displayName: Upload NuGet artifact
        inputs:
          targetPath: $(Build.SourcesDirectory)/artifacts/nupkg
          artifact: $(PackageArtifactName)

  - job: docs_deploy
    displayName: docs-deploy
    dependsOn: docs_build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['DocsAzureServiceConnection'], ''), ne(variables['DocsStorageAccount'], ''))
    pool:
      name: $(AgentPoolName)
    steps:
      - download: current
        artifact: $(DocsArtifactName)

      - task: AzureCLI@2
        displayName: Deploy docs to Azure static website
        inputs:
          azureSubscription: $(DocsAzureServiceConnection)
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $source = "$(Pipeline.Workspace)/$(DocsArtifactName)"
            az storage blob upload-batch --account-name "$(DocsStorageAccount)" --destination '$web' --source $source --overwrite true

  # Shared module publishing (McpRepl to PSGallery, @sharpninja/mcp-repl to npm).
  # Requires secrets PSGalleryApiKey and NPM_API_KEY configured in pipeline / variable group.
  # Env var mapping below makes the secret available inside the pwsh process (ADO secret handling).
  - job: publish_shared_modules
    displayName: publish-shared-modules
    dependsOn: build_test_publish
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      name: $(AgentPoolName)
    steps:
      - checkout: self

      # Publish PowerShell module (McpRepl) to PowerShell Gallery
      - task: PowerShell@2
        displayName: Publish McpRepl to PowerShell Gallery
        condition: succeeded()
        env:
          # Refresh: PSGalleryApiKey secret mapped here so Publish-Module can see it via $env:
          PSGALLERYAPIKEY: $(PSGalleryApiKey)
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $apiKey = $env:PSGALLERYAPIKEY
            if ([string]::IsNullOrWhiteSpace($apiKey) -or $apiKey.StartsWith('$(')) {
              Write-Host "PSGalleryApiKey not configured — skipping PowerShell Gallery publish."
              exit 0
            }

            $moduleRoot = "$(Build.SourcesDirectory)/tools/powershell/McpRepl"
            Write-Host "Publishing McpRepl from $moduleRoot"
            Publish-Module -Path $moduleRoot -NuGetApiKey $apiKey -Verbose

      # Publish TypeScript shared package to npm
      - task: NodeTool@0
        displayName: Use Node.js 20.x
        inputs:
          versionSpec: '20.x'

      - task: PowerShell@2
        displayName: Publish @sharpninja/mcp-repl to npm
        condition: succeeded()
        env:
          # Refresh: NPM_API_KEY secret mapped to the conventional NODE_AUTH_TOKEN that npm tooling uses
          NODE_AUTH_TOKEN: $(NPM_API_KEY)
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $token = "$(NPM_API_KEY)"
            if ([string]::IsNullOrWhiteSpace($token) -or $token.StartsWith('$(')) {
              Write-Host "NPM_API_KEY not configured — skipping npm publish."
              exit 0
            }

            Set-Location "$(Build.SourcesDirectory)/tools/typescript/mcp-repl-ts"

            # Ensure the token is configured for the @sharpninja scope / npm registry
            npm config set //registry.npmjs.org/:_authToken=$env:NODE_AUTH_TOKEN

            npm ci
            npm run build --if-present
            npm publish --access public


