Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning
Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      McpServer.Support.Mcp.Logging: Verbose
AllowedHosts: '*'
DataFolder: .
Embedding:
  Dimensions: 384
  MaxSequenceLength: 128
  AutoDownload: true
VectorIndex:
  Dimensions: 384
  MaxElements: 100000
  M: 16
  EfConstruction: 200
  EfSearch: 50
  IndexPath: mcp-data/vector.idx
Mcp:
  Database:
    Provider: sqlite
    MigrationsAssembly: ""
    Sqlite:
      DataSource: mcp.db
    PostgreSql:
      ConnectionString: ""
    SqlServer:
      ConnectionString: ""
    Encryption:
      Enabled: false
      Sqlite:
        Key: ""
        SeeToolPath: ""
      PostgreSql:
        KeyProvider: ""
        PrincipalKey: ""
      SqlServer:
        CertificateName: ""
        DatabaseEncryptionKeyName: ""
  DatabaseProvider: sqlite
  PostgresConnectionString: ""
  SqlServerConnectionString: ""
  DatabaseMigrationsAssembly: ""
  Port: 7147
  DataSource: mcp.db
  DataDirectory: .
  RepoRoot: .
  TodoFilePath: docs/Project/TODO.yaml
  SessionsPath: docs/sessions
  UnifiedModelSchemaPath: docs/schemas/UnifiedModel.schema.json
  ExternalDocsPath: docs/external
  MaxWebsitePages: 5000
  MaxWebsiteDepth: 2
  MaxWebsiteBytesPerPage: 262144
  MaxWebsiteRedirects: 3
  WebsiteRequestTimeoutSeconds: 120
  WebsiteRequestMaxAttempts: 3
  WebsiteRequestRetryDelayMilliseconds: 1000
  WebsiteAllowedSchemes:
  - http
  - https
  WebsiteBlockedHosts:
  - localhost
  RepoAllowlist:
  - src/McpServer.Cqrs/**/*.cs
  - src/McpServer.Cqrs.Mvvm/**/*.cs
  DesktopLaunch:
    Enabled: false
    AccessToken: ""
    AllowedExecutables: []
  GraphRag:
    Enabled: true
    EnhanceContextSearch: true
    RootPath: mcp-data/graphrag
    DefaultQueryMode: local
    DefaultMaxChunks: 20
    IndexTimeoutSeconds: 600
    QueryTimeoutSeconds: 120
    MaxConcurrentIndexJobsPerWorkspace: 1
    ArtifactVersion: v1
  TodoStorage:
    Provider: sqlite
    SqliteDataSource: mcp.db
  Instances:
    default:
      Port: 7147
      DataSource: mcp.db
      DataDirectory: .
      RepoRoot: .
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp.db
    alt-local:
      Port: 7157
      DataSource: mcp-alt.db
      DataDirectory: .
      RepoRoot: docs
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp-alt.db
  ToolRegistry:
    DefaultBuckets:
    - Name: official
      Owner: sharpninja
      Repo: McpServerTools
      Branch: main
      ManifestPath: /
  Tunnel:
    Provider: ""
    Port: 7147
    Ngrok:
      Enabled: false
      Subdomain: ""
      AuthToken: ""
      Region: us
    Cloudflare:
      Enabled: false
      TunnelName: ""
      Hostname: ""
    Frp:
      ServerAddress: 127.0.0.1
      ServerPort: 7000
  Federation:
    Enabled: false
    Role: Standalone
    HubBaseUrl: ""
    HubAccessToken: ""
    ProxyId: ""
    EnrollmentToken: ""
    MaxHops: 3
    DefaultTarget: ""
    Targets: []
    WorkspaceRoutes: []
    Queue:
      Enabled: true
      MaxReplayAttempts: 10
      MaxBodyBytes: 1048576
    Sync:
      HeartbeatSeconds: 30
      ReplayIntervalSeconds: 15
      FanoutIntervalSeconds: 15
    Signing:
      Enabled: true
      SharedSecret: ""
      EnvelopeTtlSeconds: 300
    LocalExecution:
      Enabled: false
      AllowedMethods:
      - desktop_launch
  InteractionLogging:
    LoggingServiceUrl: ""
    QueueCapacity: 1000
    IncludeQueryString: false
  Parseable:
    Enabled: false
    Url: ""
    StreamName: mcp
    Username: ""
    Password: ""
    FallbackLogPath: logs/mcp-.log
  IdentityServer:
    Enabled: false
    IssuerUri: ""
    ConnectionString: ""
    DatabaseName: McpIdentity
    SeedDefaults: true
    DefaultAdminUser: admin
    DefaultAdminPassword: McpAdmin1!
    ApiScopeName: mcp-api
    ApiResourceName: mcp-server-api
  PairingUsers: []

