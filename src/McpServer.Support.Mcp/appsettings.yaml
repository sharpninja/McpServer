Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning
Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      McpServer.Support.Mcp.Logging: Verbose
AllowedHosts: '*'
DataFolder: .
Embedding:
  Dimensions: 384
  MaxSequenceLength: 128
  AutoDownload: true
VectorIndex:
  Dimensions: 384
  MaxElements: 100000
  M: 16
  EfConstruction: 200
  EfSearch: 50
  IndexPath: mcp-data/vector.idx
Mcp:
  DatabaseProvider: sqlite
  PostgresConnectionString: ''
  Port: 7147
  DataSource: mcp.db
  DataDirectory: .
  RepoRoot: .
  TodoFilePath: docs/Project/TODO.yaml
  SessionsPath: docs/sessions
  UnifiedModelSchemaPath: docs/schemas/UnifiedModel.schema.json
  ExternalDocsPath: docs/external
  MaxWebsitePages: 5000
  MaxWebsiteDepth: 2
  MaxWebsiteBytesPerPage: 262144
  MaxWebsiteRedirects: 3
  WebsiteRequestTimeoutSeconds: 120
  WebsiteRequestMaxAttempts: 3
  WebsiteRequestRetryDelayMilliseconds: 1000
  WebsiteAllowedSchemes:
  - http
  - https
  WebsiteBlockedHosts:
  - localhost
  RepoAllowlist:
  - src/McpServer.Cqrs/**/*.cs
  - src/McpServer.Cqrs.Mvvm/**/*.cs
  GraphRag:
    Enabled: true
    EnhanceContextSearch: true
    RootPath: mcp-data/graphrag
    DefaultQueryMode: local
    DefaultMaxChunks: 20
    IndexTimeoutSeconds: 600
    QueryTimeoutSeconds: 120
    MaxConcurrentIndexJobsPerWorkspace: 1
    ArtifactVersion: v1
  TodoStorage:
    Provider: sqlite
    SqliteDataSource: mcp.db
  Instances:
    default:
      Port: 7147
      DataSource: mcp.db
      DataDirectory: .
      RepoRoot: .
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp.db
    alt-local:
      Port: 7157
      DataSource: mcp-alt.db
      DataDirectory: .
      RepoRoot: docs
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp-alt.db
  ToolRegistry:
    DefaultBuckets:
    - Name: official
      Owner: sharpninja
      Repo: McpServerTools
      Branch: main
      ManifestPath: /
  Tunnel:
    Provider: ''
    Port: 7147
    Ngrok:
      Enabled: false
      Subdomain: ''
      AuthToken: ''
      Region: us
    Cloudflare:
      Enabled: false
      TunnelName: ''
      Hostname: ''
    Frp:
      ServerAddress: 127.0.0.1
      ServerPort: 7000
  InteractionLogging:
    LoggingServiceUrl: ''
    QueueCapacity: 1000
    IncludeQueryString: false
  Parseable:
    Url: http://localhost:8000
    IngestUrl: http://localhost:8000/api/v1/ingest
    StreamName: mcp
    Username: admin
    Password: admin
    FallbackLogPath: logs/mcp-.log
  PairingUsers: []
