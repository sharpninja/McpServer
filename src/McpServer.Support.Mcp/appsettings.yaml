  DefaultExecutionStrategy: grok-cli
  UseEchoHelperFallback: true
  GuardEnabled: true
  CorpusBootstrapEnabled: true
  MaxContextCharacters: 12000
  ContextSearchChunkLimit: 8
  PinnedPaths:
