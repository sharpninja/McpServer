    - workspace:AGENTS.md
    - workspace:.github/copilot-instructions.md
    - primary:docs/MCP-SERVER.md
    - primary:docs/CLIENT-INTEGRATION.md
    - primary:docs/context/todo-schema.md
    - primary:docs/context/session-log-schema.md
    - primary:docs/context/api-capabilities.md
    - primary:templates/prompt-templates.yaml
    - data:templates/prompt-templates.yaml
    - install:templates/prompt-templates.yaml
  TranscriptDirectory: agent-help/transcripts
  IncidentDirectory: agent-help/incidents
DataFolder: .
Embedding:
  Dimensions: 384
  MaxSequenceLength: 128
  AutoDownload: true
VectorIndex:
  Dimensions: 384
  MaxElements: 100000
  M: 16
  EfConstruction: 200
  EfSearch: 50
  IndexPath: mcp-data/vector.idx
