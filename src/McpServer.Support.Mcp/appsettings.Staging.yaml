Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      McpServer.Support.Mcp.Logging: Verbose

DataFolder: "."

Mcp:
  Database:
    Provider: sqlite
    MigrationsAssembly: ""
    Sqlite:
      DataSource: mcp.db
    PostgreSql:
      ConnectionString: ""
    SqlServer:
      ConnectionString: ""
    Encryption:
      Enabled: false
      Sqlite:
        Key: ""
        SeeToolPath: ""
      PostgreSql:
        KeyProvider: ""
        PrincipalKey: ""
      SqlServer:
        CertificateName: ""
        DatabaseEncryptionKeyName: ""
  DatabaseProvider: sqlite
  PostgresConnectionString: ""
  SqlServerConnectionString: ""
  DatabaseMigrationsAssembly: ""
  Port: 7147
  DataSource: mcp.db
  DataDirectory: "."
  RepoRoot: "."
  TodoFilePath: docs/Project/TODO.yaml
  TodoStorage:
    Provider: sqlite
    SqliteDataSource: mcp.db
  Instances:
    default:
      Port: 7147
      DataSource: mcp.db
      DataDirectory: "."
      RepoRoot: "."
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp.db
    alt-local:
      Port: 7157
      DataSource: mcp-alt.db
      DataDirectory: "."
      RepoRoot: docs
      TodoFilePath: docs/Project/TODO.yaml
      TodoStorage:
        Provider: sqlite
        SqliteDataSource: mcp-alt.db
  InteractionLogging:
    LoggingServiceUrl: ""
    QueueCapacity: 1000
    IncludeQueryString: false
  Parseable:
    Enabled: false
    Url: ''
    StreamName: mcp
