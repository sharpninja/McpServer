mode: ContinuousDelivery
next-version: 0.2.20
assembly-versioning-scheme: MajorMinorPatch
assembly-informational-format: '{SemVer}+Branch.{BranchName}.Sha.{ShortSha}'
branches:
  main:
    regex: ^master$|^main$
    label: ''
    increment: Patch
  develop:
    regex: ^dev(elop)?(ment)?$
    label: beta
    increment: Minor
  feature:
    regex: ^features?[/-]
    label: alpha
    increment: Inherit
  release:
    regex: ^releases?[/-]
    label: beta
    increment: None
  hotfix:
    regex: ^hotfix(es)?[/-]
    label: beta
    increment: Patch
