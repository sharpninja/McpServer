  summary: >-
    Analyze a TODO item, generate FR/TR entries via Copilot CLI,

    update docs/Project/*.md, and return the assigned FR/TR IDs.
  example: []
  syntax:
    content: Task<RequirementsAnalysisResult> AnalyzeAsync(string todoId, CancellationToken cancellationToken = default)
    parameters:
    - id: todoId
      type: System.String
      description: The TODO item id to analyze.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancellation token.
    return:
      type: System.Threading.Tasks.Task{McpServer.Support.Mcp.Services.RequirementsAnalysisResult}
      description: Result containing assigned FR and TR IDs, or an error.
    content.vb: Function AnalyzeAsync(todoId As String, cancellationToken As CancellationToken = Nothing) As Task(Of RequirementsAnalysisResult)
