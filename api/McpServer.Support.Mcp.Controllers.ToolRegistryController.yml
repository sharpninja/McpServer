      [HttpGet("search")]

      [ProducesResponseType(typeof(ToolSearchResult), 200)]

      public Task<ActionResult<ToolSearchResult>> SearchAsync(string keyword, string? workspace = null, CancellationToken ct = default)
    parameters:
    - id: keyword
