services:
  qbrain-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: qbrain-ai:latest
    container_name: qbrain-ai
    ports:
      - "7147:7147"
    volumes:
      - ${MCP_WORKSPACE:-.}:/workspace:ro
      - qbrain-ai-data:/data
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - QBrainAi__Port=7147
      - QBrainAi__RepoRoot=/workspace
      - QBrainAi__DataSource=mcp.db
      - QBrainAi__DataDirectory=/data
      - VectorIndex__IndexPath=/data/vector.idx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7147/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - qbrain-ai-network

volumes:
  qbrain-ai-data:
    driver: local

networks:
  qbrain-ai-network:
    driver: bridge
