  - id: saas-14-risk-analysis
    title: SaaS Business Plan — Risk Analysis & Mitigation
    done: false
    description:
    - '### 13.1 Technical Risks'
    - '**Risk: MCP protocol instability / breaking changes**'
    - '- Probability: Medium (protocol is new and evolving)'
    - '- Impact: High (platform breaks for all customers)'
    - '- Mitigation: Contribute to MCP spec process; maintain protocol version pinning; implement adapter layer to support multiple MCP versions simultaneously; track Anthropic MCP changelog via automated dependency monitoring.'
    - '**Risk: Embedding model dependency (ONNX/ML.NET)**'
    - '- Probability: Low'
    - '- Impact: Medium (context search degrades)'
    - '- Mitigation: Embedding model is bundled and version-pinned. Migration path to newer models documented. Feature flag to disable vector search and fall back to FTS5 only.'
    - '**Risk: SQLite concurrency under multi-user load**'
    - '- Probability: Medium (multiple users querying same server simultaneously)'
    - '- Impact: Medium (slow queries, lock timeouts)'
    - '- Mitigation: Each server gets its own SQLite file. Kubernetes pod gives dedicated process. WAL mode enabled. Per-server connection pooling. Load testing as part of pre-launch gate.'
    - '**Risk: Data loss (SQLite file corruption or pod failure)**'
    - '- Probability: Low (with proper architecture)'
    - '- Impact: Very High'
    - '- Mitigation: Azure Files ZRS for primary storage (hardware-level redundancy); hourly snapshots to Blob Storage; daily full backup; point-in-time recovery for 30 days.'
    - '### 13.2 Market Risks'
    - '**Risk: GitHub builds native McpServer into Copilot**'
    - '- Probability: Medium (Microsoft owns GitHub, invested in MCP)'
    - '- Impact: High (potentially makes the product irrelevant for GitHub-only workflows)'
    - "- Mitigation: Multi-vendor support (Cursor, Claude, JetBrains, VS Code beyond Copilot); deeper feature set than what GitHub would likely build natively; focus on enterprise collaboration features GitHub wouldn't prioritize."
    - '**Risk: MCP adoption slower than expected**'
    - '- Probability: Low (major vendors already committed)'
    - '- Impact: High (smaller TAM)'
    - '- Mitigation: Free tier + open source maintains brand presence; adjacent features (todo management, session logging) valuable without AI assistant integration.'
    - '**Risk: Price compression from PaaS players (Railway, Render, etc.)**'
    - '- Probability: Medium'
    - '- Impact: Medium (margin pressure on lower tiers)'
    - '- Mitigation: Differentiate on McpServer-specific features, not raw compute pricing. These players optimize for general containerized apps, not MCP context servers specifically.'
    - '### 13.3 Business Risks'
    - '**Risk: Founder dependency / single point of failure**'
    - '- Probability: Medium (early stage)'
    - '- Impact: High'
    - '- Mitigation: Document all processes; cross-train early employees; key-person insurance; hiring second technical leader by Month 12.'
    - '**Risk: Customer concentration (top 5 customers > 50% revenue)**'
    - '- Probability: Medium in Year 1'
    - '- Impact: High (one cancellation = major revenue impact)'
    - '- Mitigation: Diversify customer base aggressively; avoid single-customer > 20% of revenue; long-term contracts for Enterprise.'
    - '**Risk: Open-source fork or competitor builds clone**'
    - '- Probability: Low-Medium'
    - '- Impact: Medium (affects free tier conversion, not hosted features)'
    - '- Mitigation: The open core model is intentional; moat is in the hosted platform, not the open-source code itself. Continue contributing to open source to maintain community goodwill.'
    - '---'
    depends-on:
    - saas-13-financial-projections
    - saas-09-operations-plan
