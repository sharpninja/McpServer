    description:
    - Create typed REST client libraries for Python (PyPI) and TypeScript (npm) mirroring the McpServer.Client NuGet package — covering all 82 API endpoints across 15 controllers with typed models, error handling, and DI/factory patterns appropriate to each ecosystem.
    - 'REFERENCE IMPLEMENTATION: src/McpServer.Client/ provides the definitive pattern — facade + sub-client composition, shared auth state, dynamic port, typed exception hierarchy, SSE streaming, dual auth (API Key + Bearer JWT). 11 sub-client classes, 11 model files, MockHttpHandler test pattern.'
    - 'SCOPE: 82 REST endpoints across 15 controllers: Auth(4), Agents(14), Context(4), Diagnostic(2), Events(1 SSE), GitHub(13), Repo(3), Requirements(20), SessionLog(3), Sync(2), Todo(9), Tools(12), Tunnel(7), Voice(6), Workspace(11).'
    remaining: 'All phases. Python library (Phases 0-4: scaffold, base client, exceptions, options, 15 domain clients, facade, factory, ~80 tests). TypeScript library (Phases 5-8: scaffold, base client, exceptions, Zod types, 15 domain clients, facade, factory, ~63 tests). CI/CD (Phase 9: 4 workflows). Docs (Phase 10: 2 READMEs). Integration tests (Phase 11). Requirements (Phase 12).'
    technical-details:
    - 'PYTHON LIBRARY ARCHITECTURE: Package name mcpserver-client on PyPI. Use httpx for async HTTP (SSE support via httpx-sse). Pydantic v2 models for all DTOs with Field(alias=camelCase) for JSON compat. Facade class McpServerClient with 15 sub-client properties (.todo, .context, .session_log, .github, .repo, .sync, .tunnel, .workspace, .tools, .auth_config, .diagnostic, .agents, .requirements, .voice, .events). Python 3.10+ for match statements and union types. async context manager (__aenter__/__aexit__) for httpx client lifecycle.'
    - 'TYPESCRIPT LIBRARY ARCHITECTURE: Package name @sharpninja/mcpserver-client on npm. Use native fetch API. Zod schemas for runtime validation with inferred TypeScript types. Class-based facade McpServerClient with 15 sub-client properties. TypeScript 5.0+ with strict mode. ESM + CJS dual output via tsup. AsyncGenerator<T> for SSE streaming.'
    - 'AUTH MODEL: Both libraries must support dual auth — API Key (X-Api-Key header) and Bearer JWT (Authorization: Bearer header). Set-once credential pattern with logout() to reset. ApiKey and BearerToken are mutually exclusive. InitializeAsync fetches default API key from GET /api-key.'
    - 'SHARED STATE PATTERN: WorkspacePath set on facade propagates to all sub-clients via shared reference object. Port is read at call-time for dynamic URL construction ({scheme}://{host}:{port}/{path}). Auth credentials set once on facade, propagated to all sub-clients.'
    - 'SSE STREAMING: Python — async generators yielding str from httpx-sse (data: line parsing, event: done termination). TypeScript — AsyncGenerator<string> using fetch with ReadableStream. Required for: GET /mcpserver/events (ChangeEvent), GET /mcpserver/todo/{id}/prompt/status|implement|plan (prompt text).'
    - 'ERROR HANDLING: Map HTTP status codes to typed exceptions — 400->ValidationError, 401->UnauthorizedError, 404->NotFoundError, 409->ConflictError, 5xx->ServerError. Extract error message from JSON response body (error or errorMessage field). Python: raise exceptions. TypeScript: throw errors.'
    - 'TESTING: Python — pytest + pytest-asyncio + respx (httpx mock transport). TypeScript — vitest + msw (Mock Service Worker). Mirror the C# MockHttpHandler pattern — intercept at HTTP transport layer, no network needed. Min 2 tests per client (GET + POST), ~60 tests per language.'
    - 'PACKAGING: Python — pyproject.toml with hatchling build backend, src layout, py.typed marker for PEP 561. TypeScript — package.json with tsup for bundling, dual ESM/CJS output, .d.ts type declarations. Both: README, LICENSE (MIT), CHANGELOG.'
