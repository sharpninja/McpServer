  - id: MVP-MCP-004
    title: Migrate all templates to YAML files
    estimate: 3-4 days AI-assisted
    note: Completed 2026-03-01. Commit b9990c8. 3 provider interfaces (IMarkerPromptProvider, ITodoPromptProvider, PairingHtmlRenderer) with YAML file loading and built-in fallbacks. 19 new tests (434 total). FR-MCP-050, TR-MCP-TPL-005, TEST-MCP-058-060.
    done: true
    description:
    - Externalize all inline template strings from C# source code into loadable YAML files, enabling runtime customization without recompilation.
    - MarkerFileService.DefaultPromptTemplate (570 lines of Handlebars) is the primary migration target — move to templates/default-marker-prompt.hbs.yaml.
    - 'TodoPromptDefaults (3 templates: StatusPrompt, ImplementPrompt, PlanPrompt) — move to templates/todo-prompts.yaml.'
    - 'PairingHtml (3 HTML pages: LoginPage, KeyPage, NotConfiguredPage) — move to templates/pairing-pages.yaml.'
    - Template rendering engines (HandlebarsDotNet for marker, string.Replace for TODO prompts, C# interpolation for HTML) remain in code. Only the template content source changes from const string to file-loaded string.
    - 'Configuration: Mcp:TemplatePath setting specifies base directory for template files (default: templates/ relative to content root). Templates loaded at startup and cached. IOptionsMonitor for hot-reload support.'
    technical-details:
    - 'TEMPLATE FILE FORMAT: Each YAML file contains named template strings. The YAML structure varies by category: marker prompt is a single multi-line string under a key, TODO prompts are 3 named strings, pairing pages are 3 named strings. Use YAML block scalars (|) for multi-line template content to preserve formatting.'
    - 'MARKER PROMPT TEMPLATE FILE (templates/default-marker-prompt.hbs.yaml): Structure: { template: | ... 570 lines of Handlebars ... }. Loaded by MarkerFileService at startup. Falls back to embedded resource or inline constant if file not found (graceful degradation). Handlebars placeholders: {{baseUrl}}, {{apiKey}}, {{workspace.*}}, {{#if}}/{{#each}} blocks for ban lists. File preserves exact Handlebars syntax — no conversion needed.'
    - 'TODO PROMPT TEMPLATE FILE (templates/todo-prompts.yaml): Structure: { statusPrompt: |, implementPrompt: |, planPrompt: | }. Loaded by TodoPromptService via IOptionsMonitor<TodoPromptOptions>. Placeholder syntax: {id}, {title}, {baseUrl} — simple string.Replace, not Handlebars. Existing Mcp:TodoPrompts config section overrides file values (config > file > default).'
    - 'PAIRING HTML TEMPLATE FILE (templates/pairing-pages.yaml): Structure: { loginPage: |, keyPage: |, notConfiguredPage: | }. Loaded by PairingHtml static class (refactored to instance with DI). HTML uses C# string interpolation — template file contains raw HTML with {0}, {1} placeholder tokens for String.Format or named {{variable}} tokens for simple replacement.'
    - 'TEMPLATE LOADING SERVICE: Create ITemplateLoader interface with LoadAsync<T>(string templateName, CancellationToken ct) -> T. Implementation TemplateFileLoader reads from Mcp:TemplatePath directory using YamlDotNet deserialization. Registered as singleton in DI. Caches loaded templates in ConcurrentDictionary. Supports hot-reload via FileSystemWatcher (optional, behind config flag).'
    - 'FALLBACK STRATEGY: If template file does not exist, fall back to embedded constant (existing DefaultPromptTemplate, TodoPromptDefaults, PairingHtml inline strings). Log warning on fallback. This ensures zero-config startup still works and existing deployments are not broken.'
    - 'CONFIGURATION: New appsettings.json section Mcp:Templates: { BasePath: "templates", EnableHotReload: false, EnableFileSystemWatcher: false }. BasePath resolved relative to content root. Empty or missing BasePath means use embedded defaults.'
    - 'TESTING: Unit tests verify: (1) TemplateFileLoader reads and deserializes YAML correctly, (2) fallback to embedded defaults when file missing, (3) MarkerFileService uses loaded template instead of const, (4) TodoPromptService uses loaded templates, (5) config override precedence: appsettings > file > embedded default.'
    implementation-tasks:
    - task: 'Phase 0 — Create template file directory and initial files: Create templates/ directory at repo root (already exists for DocFX — add new files alongside existing). Create templates/default-marker-prompt.hbs.yaml containing the exact 570-line Handlebars template currently in MarkerFileService.DefaultPromptTemplate (lines 26-595). Verify content is identical via diff.'
      done: false
    - task: 'Phase 1.1 — Extract marker prompt template: Copy MarkerFileService.DefaultPromptTemplate (const string, lines 26-595 of MarkerFileService.cs) into templates/default-marker-prompt.hbs.yaml as a YAML block scalar. Structure: template: | followed by the entire Handlebars template indented 2 spaces. Verify all Handlebars syntax ({{baseUrl}}, {{apiKey}}, {{workspace.name}}, {{#if}}, {{#each}}, etc.) is preserved exactly. Test by loading with YamlDotNet and comparing to original const string.'
      done: false
    - task: 'Phase 1.2 — Extract TODO prompt templates: Create templates/todo-prompts.yaml with 3 block scalars: statusPrompt: |, implementPrompt: |, planPrompt: |. Copy content from TodoPromptDefaults.StatusPrompt (~8 lines), TodoPromptDefaults.ImplementPrompt (~18 lines), TodoPromptDefaults.PlanPrompt (~12 lines). Verify {id}, {title}, {baseUrl} placeholders are preserved.'
      done: false
    - task: 'Phase 1.3 — Extract pairing HTML templates: Create templates/pairing-pages.yaml with 3 block scalars: loginPage: |, keyPage: |, notConfiguredPage: |. Copy HTML content from PairingHtml.LoginPage() (~35 lines), PairingHtml.KeyPage() (~50 lines), PairingHtml.NotConfiguredPage() (~25 lines). Convert C# string interpolation variables to named {placeholder} tokens (e.g., {{baseUrl}}, {{apiKey}}, {{errorMessage}}).'
      done: false
    - task: 'Phase 2.1 — Create ITemplateLoader interface: Create src/McpServer.Support.Mcp/Services/ITemplateLoader.cs with interface ITemplateLoader. Methods: Task<string> LoadMarkerPromptTemplateAsync(CancellationToken ct = default), Task<TodoPromptTemplates> LoadTodoPromptTemplatesAsync(CancellationToken ct = default), Task<PairingPageTemplates> LoadPairingPageTemplatesAsync(CancellationToken ct = default). Create DTO records: TodoPromptTemplates (StatusPrompt, ImplementPrompt, PlanPrompt), PairingPageTemplates (LoginPage, KeyPage, NotConfiguredPage). XML doc comments required (CS1591).'
      done: false
    - task: 'Phase 2.2 — Create TemplateOptions: Create src/McpServer.Support.Mcp/Configuration/TemplateOptions.cs with properties: BasePath (string, default "templates"), EnableHotReload (bool, default false). Bind to appsettings.json section Mcp:Templates. Register via builder.Services.Configure<TemplateOptions>(config.GetSection("Mcp:Templates")) in Program.cs.'
      done: false
    - task: 'Phase 2.3 — Create TemplateFileLoader implementation: Create src/McpServer.Support.Mcp/Services/TemplateFileLoader.cs implementing ITemplateLoader. Constructor injects IOptions<TemplateOptions>, ILogger<TemplateFileLoader>. Private: _cache (ConcurrentDictionary<string, string>), _basePath (resolved from TemplateOptions.BasePath relative to AppContext.BaseDirectory). LoadMarkerPromptTemplateAsync: read templates/default-marker-prompt.hbs.yaml, deserialize with YamlDotNet, extract template key, cache result. On FileNotFoundException: log warning, return MarkerFileService.DefaultPromptTemplate (fallback). LoadTodoPromptTemplatesAsync: read templates/todo-prompts.yaml, deserialize to TodoPromptTemplates. Fallback: return TodoPromptDefaults values. LoadPairingPageTemplatesAsync: read templates/pairing-pages.yaml, deserialize to PairingPageTemplates. Fallback: return PairingHtml inline values. All methods use ConfigureAwait(false).'
