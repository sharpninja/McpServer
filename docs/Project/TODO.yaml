    - task: '[Commit 1 - MVP] Add provider startup validation/logging in FrpTunnelProvider (sanitized server/port/proxy type) and optional Program.cs log indicating Provider=frp selected'
      done: true
    - task: '[Commit 2 - Hardening] Capture frpc stdout/stderr asynchronously in FrpTunnelProvider, surface actionable errors in TunnelStatus.Error, and log connection lifecycle without exposing secrets'
      done: true
    - task: '[Commit 2 - Hardening] Add FRP option validation in FrpTunnelProvider for incompatible/missing combinations (for example Subdomain + CustomDomain, unsupported ProxyType, missing required values)'
      done: true
    - task: '[Commit 2 - Hardening] Handle frpc process exit after startup and update provider status/error state so GetStatusAsync reports crashes accurately'
      done: true
    - task: '[Commit 3 - Railway Assets] Add infra/frp/railway/Dockerfile to run self-hosted frps on Railway'
      done: true
    - task: '[Commit 3 - Railway Assets] Add infra/frp/railway/entrypoint.sh and frps.toml.template to generate frps runtime config from environment variables (token auth + HTTP vhost mode)'
      done: true
    - task: '[Commit 3 - Railway Assets] Add infra/frp/railway/.env.example and README.md documenting required Railway service variables and exposed ports'
      done: true
    - task: '[Commit 3 - Railway Assets] Optional local parity: add infra/frp/local/docker-compose.frps.yml for local frps validation before Railway deployment'
      done: true
    - task: '[Commit 4 - Tests] Add tests/McpServer.Support.Mcp.Tests/Services/FrpTunnelProviderTests.cs covering config generation, PublicUrl precedence (PublicBaseUrl > CustomDomain > Subdomain), and invalid-option validation'
      done: true
    - task: '[Commit 4 - Tests] Add tests for missing frpc binary / startup failure paths and temp config cleanup behavior in FrpTunnelProvider'
      done: true
    - task: '[Commit 5 - Docs] Add docs/Operations/Tunnel-FRP-Railway.md runbook with Railway frps deployment steps, TCP proxy setup for frps bind port, and MCP appsettings.json examples for Mcp:Tunnel:Provider=frp'
      done: true
    - task: '[Commit 5 - Docs] Add troubleshooting notes (token mismatch, wrong public URL, port mismatch, frpc not found) and an end-to-end validation checklist (/health through FRP public URL)'
      done: true
  - id: ngrok-tunnel-strategy
    title: ngrok tunnel strategy for MCP remote/mobile access in single-public-port environments
    estimate: 1-2 days
    note: ngrok provider already exists (NgrokTunnelProvider). This strategy is the preferred managed-tunnel path when the hosting/network environment does not support exposing multiple public ports.
    done: true
    description:
    - Use the existing ngrok provider in McpServer.Support.Mcp for the primary MCP host endpoint on port 7147.
    - 'Strategy decision: single-public-port ngrok deployments expose the primary MCP host only (7147). Child workspace listeners (7147+) remain private unless a separate gateway/proxy feature is implemented.'
    - Add operational guidance and validation steps for local/dev and deployed environments, including OIDC proxy endpoints for mobile device-flow auth on the same public hostname.
    technical-details:
    - 'Existing integration points: src/McpServer.Support.Mcp/Services/NgrokTunnelProvider.cs, src/McpServer.Support.Mcp/Options/TunnelOptions.cs, src/McpServer.Support.Mcp/Program.cs.'
    - Current provider starts `ngrok http {Mcp:Tunnel:Port}` and discovers the public URL via the local ngrok API (`http://127.0.0.1:4040/api/tunnels`) using `curl`.
    - 'ngrok auth token handling is already secret-safe in provider startup: token is passed via `NGROK_AUTHTOKEN` environment variable instead of CLI args.'
    - No generic primary-host reverse proxy exists today for child workspace ports; strategy is primary-only public exposure. Use FRP TCP mode for multi-port/child-workspace public access.
    - 'Remote/mobile auth can stay on the same public ngrok hostname via existing OIDC proxy routes: `/auth/config`, `/auth/device`, `/auth/token`, and `/auth/ui/*`.'
    implementation-tasks:
    - task: '[Commit 1 - Strategy] Decide and document single-public-endpoint access model for workspaces when Provider=ngrok (chosen: primary-only exposure; child workspace ports remain private)'
      done: true
    - task: '[Commit 2 - Provider Hardening] Verify NgrokTunnelProvider startup/error/status behavior and add missing timeout/exit diagnostics (including clearer handling when ngrok local API/curl is unavailable)'
      done: true
    - task: '[Commit 3 - Docs] Add docs/Operations/Tunnel-Ngrok.md runbook with appsettings.json examples, token setup, single-port workspace access model, OIDC proxy notes, and public /health validation checklist'
      done: true
  - id: cloudflare-tunnel-strategy
    title: Cloudflare Tunnel strategy for MCP remote/mobile access in single-public-port environments
    estimate: 1-3 days
    note: Cloudflare tunnel provider already exists (CloudflareTunnelProvider). This strategy is the preferred no-open-port path when Cloudflare DNS/Tunnel is available.
    done: true
    description:
    - Use the existing Cloudflare tunnel provider in McpServer.Support.Mcp to expose the primary MCP host endpoint on port 7147.
    - 'Strategy decision: single-host Cloudflare Tunnel deployments expose the primary MCP host only (7147). Child workspace listeners (7147+) remain private unless a separate gateway/proxy feature is implemented.'
    - Produce deployment guidance for cloudflared quick tunnels and named tunnels, including credentials/runtime prerequisites and hostname routing responsibilities.
    technical-details:
    - 'Existing integration points: src/McpServer.Support.Mcp/Services/CloudflareTunnelProvider.cs, src/McpServer.Support.Mcp/Options/TunnelOptions.cs, src/McpServer.Support.Mcp/Program.cs.'
    - Current provider supports quick tunnel mode (`cloudflared tunnel --url http://localhost:{port}`) and named tunnel mode (`cloudflared tunnel run {TunnelName}`); it captures quick-tunnel URLs by parsing stderr.
    - Named tunnel hostnames/DNS routes are managed outside the provider (Cloudflare dashboard or cloudflared commands). `Hostname` is only passed in quick-tunnel mode in the current implementation.
    - 'Document prerequisites: Cloudflare account/zone, cloudflared login + named tunnel creation (for stable hostnames), and credentials/config availability for the runtime account.'
    - Validate public URL/status reporting and error surfacing when cloudflared is missing or tunnel auth is invalid; named tunnel status may be healthy even when no URL is captured from stderr.
    - 'Remote/mobile auth can stay on the same public Cloudflare hostname via existing OIDC proxy routes: `/auth/config`, `/auth/device`, `/auth/token`, and `/auth/ui/*`.'
    implementation-tasks:
    - task: '[Commit 1 - Strategy] Decide and document single-host workspace access model for Provider=cloudflare (chosen: primary-only exposure; child workspace ports remain private)'
      done: true
    - task: '[Commit 2 - Provider Hardening] Verify CloudflareTunnelProvider startup/error/status behavior and add startup timeout/process-exit diagnostics plus improved URL/status reporting for named tunnels'
      done: true
    - task: '[Commit 3 - Docs] Add docs/Operations/Tunnel-Cloudflare.md runbook with quick/named tunnel setup, hostname routing, appsettings.json examples, single-port workspace access model, and public /health validation checklist'
      done: true
saas:
  medium-priority:
  - id: saas-01-executive-summary
    title: SaaS Business Plan — Executive Summary
    done: false
    description:
    - '**Confidential — Draft**'
    - '---'
    - 1. Executive Summary
    - 2. Company Overview
    - 3. Problem Statement
    - 4. Product Vision & Value Proposition
    - 5. Market Analysis
    - 6. Product & Service Offering
    - 7. Business Model & Pricing Strategy
    - 8. Go-to-Market Strategy
    - 9. Competitive Landscape
    - 10. Customer Acquisition & Retention
    - 11. Operations Plan
    - 12. Financial Projections
    - 13. Risk Analysis & Mitigation
    - 14. Legal, Compliance & Security
    - 15. Funding Requirements & Use of Funds
    - 16. Exit Strategy
    - '---'
    - '**Company Name:** McpServer Cloud (working title; also viable: ContextHub, MCPHost, ContextForge)'
    - '**Product:** A fully managed, cloud-hosted SaaS platform that provisions isolated McpServer instances for software development teams, enabling AI coding assistants (GitHub Copilot, Cursor, Claude, etc.) to access rich, persistent, project-specific context — including todos, session logs, repository search, and GitHub integration — without requiring teams to self-host or maintain infrastructure.'
    - '**Problem:** AI coding assistants are becoming central to software development workflows, but they are stateless and context-poor. McpServer solves this by providing a persistent context layer — but today it requires manual installation, self-hosting expertise, infrastructure management, and a working knowledge of the MCP protocol. This excludes the vast majority of development teams who want the benefit without the operational overhead.'
    - '**Solution:** McpServer Cloud abstracts away all infrastructure. Customers sign up, point the platform at a GitHub repository, and receive a dedicated hosted McpServer instance within minutes. A GitHub-style web portal lets them manage subscriptions, configure server settings, inspect session logs, manage todos, and invite teammates — all without touching a command line.'
    - '**Business Model:** Subscription SaaS (monthly/annual). Tiers from Free (single user, one server) through Enterprise (unlimited users, custom SLAs, SSO, SAML, audit logs, dedicated infrastructure).'
    - '**Target Market:** Software engineering teams (2–500+ developers) using AI coding tools professionally. Initial focus on small-to-mid-size startups and development agencies; expand to enterprise engineering organizations.'
    - '**Revenue Projections (Conservative):**'
    - '- Year 1: $480K ARR (400 paying teams × $100/mo average)'
    - '- Year 2: $2.4M ARR'
    - '- Year 3: $7.2M ARR'
    - '**Funding Ask:** $2.5M seed round to fund 18 months of product development, infrastructure, and initial GTM.'
    - '---'
  - id: saas-02-company-overview
    title: SaaS Business Plan — Company Overview
    done: false
    description:
    - '### Mission'
    - To make every AI coding assistant smarter by giving development teams a persistent, searchable, project-aware context layer — hosted, managed, and available everywhere.
    - '### Vision'
    - In 5 years, McpServer Cloud will be the de-facto context infrastructure for AI-augmented software development, analogous to what GitHub is for version control or Datadog is for observability. Every team using an AI assistant will have a McpServer instance.
    - '### Values'
    - '- **Developer-first:** The product must feel natural to software engineers. Onboarding should take less time than reading a README.'
    - '- **Transparency:** Usage data, pricing, and server behavior are always visible to customers.'
    - '- **Security by default:** Isolated infrastructure per customer, encrypted at rest and in transit, never training on customer data.'
    - '- **Open core:** McpServer itself remains open-source. The SaaS layer adds managed infrastructure, collaboration, and enterprise features.'
    - '### Legal Structure'
    - Delaware C-Corp (standard for venture-backed SaaS). Registered agent in Delaware; principal offices initially in the founders' location.
    - '### Founders'
    - '_(Placeholder — to be filled with actual team bios. Ideal profile: 1–2 founders with prior .NET/cloud infrastructure or developer-tools SaaS experience, plus a technical co-founder deeply familiar with the MCP protocol and McpServer codebase.)_'
    - '---'
  - id: saas-03-problem-statement
    title: SaaS Business Plan — Problem Statement
    done: false
    description:
    - '### 3.1 The AI Coding Assistant Explosion'
    - By 2025, the majority of professional software developers at technology companies use AI coding assistants daily. Tools like GitHub Copilot (with 1.8M+ paid subscribers as of 2024), Cursor, Codeium, and Claude Code have become standard developer productivity tools. Enterprises are paying $20–$39/user/month for these tools.
    - '### 3.2 The Context Gap'
    - 'Despite the productivity gains, these tools share a fundamental limitation: **they are largely stateless and context-poor.** Each session begins fresh. The AI does not know:'
    - '- What tasks are currently in progress'
    - '- What decisions were made yesterday and why'
    - "- What the team's conventions and patterns are"
    - '- What third-party documentation the project depends on'
    - '- What a previous pair-programming session with the AI concluded'
    - Teams work around this by manually pasting README files, copying documentation into prompts, or repeating the same context every session. This is slow, error-prone, and scales poorly.
    - '### 3.3 The MCP Protocol as Solution'
    - The Model Context Protocol (MCP), standardized by Anthropic and rapidly adopted by all major AI assistant vendors, solves this at a protocol level. MCP allows AI clients to connect to a context server that provides tools (read file, search context, list todos, query session history) as structured capabilities. The AI assistant then calls these tools during a conversation rather than requiring the user to manually inject context.
    - 'McpServer implements MCP comprehensively: it indexes repositories, ingests documentation, stores session logs, manages todos, and integrates with GitHub — all queryable by an AI assistant in real time.'
    - '### 3.4 The Self-Hosting Barrier'
    - 'Despite MCP being the right solution, adoption is bottlenecked by **operational complexity**:'
    - 1. **Installation:** Requires .NET 9, Docker, or MSIX depending on platform.
    - 2. **Configuration:** `appsettings.json` with 30+ settings covering ports, paths, embedding models, vector indices, tunnel providers, GitHub tokens.
    - 3. **Persistence:** The SQLite database and vector index files must survive machine restarts, be backed up, and not be accidentally deleted.
    - 4. **Access:** By default the server runs on `localhost`. Sharing across a team requires tunneling (ngrok, Cloudflare) or reverse proxy setup.
    - 5. **Updates:** New versions require manual re-deployment.
    - 6. **Multiple projects:** Each project ideally gets its own isolated McpServer instance, multiplying all of the above.
    - 7. **Windows-only MSIX:** The packaging story is fragmented.
    - 'The result: only highly technical individual developers run McpServer today. Teams do not.'
    - '### 3.5 Market Opportunity'
    - 'This creates a clear SaaS opportunity: take something that works well but requires expert setup, and make it available to anyone in 5 minutes.'
    - '---'
  - id: saas-04-product-vision
    title: SaaS Business Plan — Product Vision & Value Proposition
    done: false
    description:
    - '### 4.1 Core Value Proposition'
    - '> **"Your AI assistant finally remembers everything — without you managing any servers."**'
    - McpServer Cloud provides every development team with a **always-on, team-shared, project-aware context server** that their AI coding tools can query in real time. No installation. No configuration. No maintenance.
    - '### 4.2 Customer Value by Persona'
    - '**Individual Developer:**'
    - '- One-click setup for a new project; MCP connection string ready in under 5 minutes.'
    - '- No Docker, no .NET SDK, no shell scripts.'
    - '- Context persists across machines (works on laptop and desktop equally).'
    - '- Free tier available.'
    - '**Engineering Team Lead:**'
    - '- Shared context across the entire team — one McpServer instance, multiple users.'
    - '- Team todos synchronized; session logs visible for review and onboarding.'
    - '- GitHub integration managed centrally, not per-developer.'
    - '**Engineering Manager / Director:**'
    - '- Visibility into AI assistant usage patterns across the team.'
    - '- Audit logs for compliance in regulated industries.'
    - '- Per-project server isolation for IP protection.'
    - '**CTO / VP Engineering:**'
    - '- Enterprise SSO (SAML/OIDC) and SCIM provisioning.'
    - '- Data residency options (US, EU).'
    - '- Custom retention policies.'
    - '- Dedicated infrastructure for zero cross-tenant data risk.'
    - '- SLA guarantee (99.9% uptime).'
    - '### 4.3 Unique Differentiators'
    - 1. **The only managed McpServer hosting platform.** There is no current competitor doing this specific thing.
    - 2. **GitHub-style developer UX.** The management portal is designed for developers, not IT admins. It feels like GitHub, not Salesforce.
    - 3. **Open core.** The underlying McpServer is open-source; customers who want to self-host always can. This builds trust and creates a natural pipeline from open-source users.
    - 4. **AI-native.** The platform itself uses McpServer internally (dogfooding) and exposes its own management API as MCP tools (meta!).
    - 5. **No vendor lock-in for AI tools.** Works with any MCP-compatible AI assistant — GitHub Copilot, Cursor, Claude, Zed, VS Code, etc.
    - '---'
    depends-on:
    - saas-01-executive-summary
    - saas-03-problem-statement
    - saas-02-company-overview
  - id: saas-05-market-analysis
    title: SaaS Business Plan — Market Analysis
    done: false
    description:
    - '### 5.1 Total Addressable Market (TAM)'
    - 'The AI developer tools market reached approximately $4.8 billion in 2024 and is projected to grow at 27% CAGR through 2030, reaching ~$20 billion. Within this:'
    - '- **GitHub Copilot** alone has 1.8M paid individual subscribers + enterprise contracts covering millions more seats.'
    - '- **Cursor** reached $100M ARR in under 2 years.'
    - '- **JetBrains AI Assistant**, **Codeium/Windsurf**, and **Amazon Q** collectively cover tens of millions of developer seats.'
    - All of these AI tools are MCP clients or will become MCP clients. Every developer using one is a potential McpServer Cloud customer.
    - '**TAM estimate:** The global developer population is ~27 million professional developers. At $100/team/month for a team of 5, and assuming 30% of teams use AI tools professionally by 2026, TAM is ~$19B annually.'
    - '### 5.2 Serviceable Addressable Market (SAM)'
    - 'McpServer Cloud targets teams using:'
    - '- GitHub Copilot (Business or Enterprise plan)'
    - '- Cursor (Business plan)'
    - '- Claude for Developers / Claude Code'
    - '- Any MCP-compatible assistant'
    - 'This cohort is roughly 5M developers currently, growing rapidly. At $100/team/month (5-person teams):'
    - '**SAM: ~$1.2B/year**'
    - '### 5.3 Serviceable Obtainable Market (SOM)'
    - 'Realistic capture in years 1–3 for a well-executed product with solid open-source distribution:'
    - '- Year 1: 0.01% of SAM = $12M potential; targeting $480K ARR (conservative ramp)'
    - '- Year 2: 0.05% of SAM = $60M potential; targeting $2.4M ARR'
    - '- Year 3: 0.15% of SAM = $180M potential; targeting $7.2M ARR'
    - These are conservative estimates benchmarked against similar developer-tools SaaS at comparable stages.
    - '### 5.4 Market Trends Supporting the Business'
    - 1. **MCP standardization:** Anthropic's MCP protocol is gaining broad adoption (Zed, Cursor, VS Code, JetBrains all announced MCP support in 2024–2025). This is the technical tide rising under our boat.
    - 2. **AI assistant seat growth:** Copilot Business is growing at ~40% YoY; Cursor growing explosively. More seats = more demand for persistent context.
    - 3. **Shift from individual to team AI tools:** Enterprise procurement of AI tools is accelerating, creating budget for team-level infrastructure.
    - 4. **Developer experience premium:** Developer tooling is one of the highest-margin SaaS categories (GitHub is ~80% gross margin). Developers pay for tools that save them time.
    - '5. **Open source to SaaS pipeline:** Projects like HashiCorp (Terraform → Terraform Cloud), Grafana, and GitLab prove the model works: open-source creates awareness, SaaS monetizes operations.'
    - '### 5.5 Customer Segments'
    - '**Segment A — Indie Developers / Freelancers (~25% of revenue)**'
    - '- 1–2 person teams'
    - '- High price sensitivity'
    - '- Convert from Free tier'
    - '- Key channel: Product Hunt, Hacker News, open-source community'
    - '- Average ACV: $100–$240/year'
    - '**Segment B — Startup Engineering Teams (2–30 developers) (~45% of revenue)**'
    - '- Primary ICP (ideal customer profile)'
    - '- Budget-conscious but value productivity heavily'
    - '- Decision maker: CTO, Engineering Lead'
    - '- Key channel: GitHub, Cursor community, developer conferences'
    - '- Average ACV: $1,200–$6,000/year'
    - '**Segment C — Mid-Market Engineering Organizations (30–500 developers) (~20% of revenue)**'
    - '- Multiple projects, multiple teams'
    - '- Procurement involves IT/Security review'
    - '- Need SSO, audit logs, SLA'
    - '- Decision maker: Director/VP Engineering + InfoSec'
    - '- Average ACV: $12,000–$60,000/year'
    - '**Segment D — Enterprise (500+ developers) (~10% of revenue, high ACV)**'
    - '- Custom contracts, dedicated infrastructure, data residency'
    - '- Sales-assisted motion'
    - '- Decision makers: CTO, CISO, VP Engineering'
    - '- Average ACV: $60,000–$240,000+/year'
    - '---'
    depends-on:
    - saas-03-problem-statement
  - id: saas-06-competitive-landscape
    title: SaaS Business Plan — Competitive Landscape
    done: false
    description:
    - '### 9.1 Direct Competitors'
    - As of early 2025, there are **no direct competitors** offering managed McpServer hosting specifically.
    - The closest analog is **Composio** (composio.dev), which provides managed MCP-compatible tool integrations, but focuses on pre-built integrations rather than custom project context.
    - '**Why no competitors yet:**'
    - '- MCP is a very new protocol (Anthropic published it in late 2024)'
    - '- McpServer itself is a niche, specialized application'
    - "- The hosted infrastructure layer is the hard part that hasn't been built yet"
    - This is a **first-mover advantage** window that will not stay open indefinitely. We estimate 6–18 months before well-funded infrastructure players (Fly.io, Railway, Render) attempt to build McpServer-specific managed offerings.
    - '### 9.2 Indirect Competitors'
    - '**General-purpose container/PaaS hosting:**'
    - '- Railway, Render, Fly.io, Heroku'
    - '- A technical developer can self-host McpServer on any of these for ~$5–15/month'
    - '- Missing: McpServer-specific management UI, collaboration features, GitHub integration, backup/restore, auto-updates, monitoring'
    - '**Context management products (adjacent):**'
    - '- **Mem.ai** — Personal knowledge base with AI; not developer-focused, not MCP-compatible'
    - '- **Obsidian Sync** — Personal knowledge sync; not team-oriented, not AI-assistant-first'
    - '- **Notion AI** — Broad knowledge base; not MCP, not dev-tool-native'
    - '- **Cody by Sourcegraph** — Code search and AI; heavy enterprise product, not MCP-based'
    - '**AI coding assistant platforms with memory:**'
    - '- **GitHub Copilot Chat** with GitHub context — Limited to GitHub.com content, no external docs, no session history'
    - '- **Cursor** with `@docs` and codebase indexing — Built into the IDE, not portable, not team-shared'
    - '- **Codeium** context — Similar limitations'
    - '**Why these are not true substitutes:**'
    - None of them implement the MCP protocol for external tool invocation. None provide the full McpServer feature set (todos, session logs, hybrid search, external docs indexing). They are single-vendor, single-tool solutions. McpServer Cloud is vendor-agnostic across all MCP-compatible AI tools.
    - '### 9.3 Competitive Moat'
    - 1. **Protocol alignment:** Deep, native MCP implementation. As MCP becomes standard, our moat deepens rather than erodes.
    - 2. **Open source trust:** Developers trust what they can inspect. The open-source core prevents "black box" concerns.
    - 3. **Data depth:** The longer a team uses McpServer Cloud, the more context, session history, and todos are accumulated. Switching cost grows over time.
    - 4. **Workspace model:** The workspace architecture maps naturally to team/project structures. Competitors would need to redesign from scratch.
    - 5. **First-mover brand:** In developer tools, brand matters. The team that builds the best McpServer Cloud experience in 2025 will be the recognized leader in 2027.
    - '---'
    depends-on:
    - saas-05-market-analysis
  - id: saas-07-product-offering
    title: SaaS Business Plan — Product & Service Offering
    done: false
    description:
    - '### 6.1 Core Product: McpServer Cloud'
    - A managed hosting platform for McpServer instances, with a web portal for management, billing, and collaboration.
    - '**What customers get:**'
    - '- A dedicated McpServer instance provisioned in a Kubernetes pod (or isolated container) per server/project'
    - '- A stable HTTPS endpoint (e.g., `https://contoso.mcpserver.cloud/`) ready to paste into Copilot or Cursor settings'
    - '- Persistent SQLite storage (backed up hourly to object storage)'
    - '- Persistent vector index (rebuilt on demand or on sync)'
    - '- GitHub OAuth integration (so `gh`-dependent tools work without CLI setup)'
    - '- Web portal for all management tasks'
    - '### 6.2 Tier Structure'
    - '#### Free Tier — "Starter"'
    - '- **Price:** $0/month'
    - '- **Servers:** 1 McpServer instance'
    - '- **Users:** 1 user'
    - '- **Storage:** 500 MB (SQLite + vector index)'
    - '- **Syncs:** Up to 10 per day'
    - '- **Repos:** 1 GitHub repo connected'
    - '- **External Docs:** Up to 10 documents indexed'
    - '- **Session Logs:** Last 30 days retained'
    - '- **Support:** Community (GitHub Discussions)'
    - '- **Uptime SLA:** None (best effort)'
    - '- **Features:** All core MCP tools (context, repo, todo, sessionlog, sync, GitHub)'
    - '- **Limitations:** No team collaboration, no custom domain, no SSO, community support only'
    - '#### Pro Tier — "Developer"'
    - '- **Price:** $19/month per user (or $190/year — 2 months free)'
    - '- **Servers:** Up to 5 McpServer instances'
    - '- **Users:** 1 user (personal plan)'
    - '- **Storage:** 5 GB per server'
    - '- **Syncs:** Unlimited'
    - '- **Repos:** Up to 10 GitHub repos connected per server'
    - '- **External Docs:** Up to 500 documents indexed per server'
    - '- **Session Logs:** 90 days retained'
    - '- **Support:** Email (48h SLA)'
    - '- **Uptime SLA:** 99.5%'
    - '- **Features:** Custom server names, API key management, basic usage analytics, server-level audit log, webhook notifications on sync completion'
    - '- **Add-ons:** Additional storage at $0.10/GB/month'
    - '#### Team Tier — "Workspace"'
    - '- **Price:** $49/month per user (or $490/year)'
    - '- **Minimum:** 2 users'
    - '- **Servers:** Up to 20 McpServer instances'
    - '- **Users:** Unlimited (seat-licensed)'
    - '- **Storage:** 20 GB per server'
    - '- **Syncs:** Unlimited + scheduled auto-sync (cron)'
    - '- **Repos:** Unlimited GitHub repos per server'
    - '- **External Docs:** Unlimited documents indexed'
    - '- **Session Logs:** 1 year retained'
    - '- **Support:** Priority email + Slack (24h SLA)'
    - '- **Uptime SLA:** 99.9%'
    - '- **Features:** Team collaboration (shared server access, role-based permissions), GitHub organization OAuth, server sharing with permission levels (Admin/Write/Read), team-wide session log visibility, shared todo management, usage dashboards per server and per user, Parseable integration for log streaming, webhook management, API rate limiting controls'
    - '- **Add-ons:** Additional servers at $15/server/month'
    - '#### Business Tier — "Organization"'
    - '- **Price:** $99/month per user (or $990/year)'
    - '- **Minimum:** 5 users'
    - '- **Servers:** Unlimited McpServer instances'
    - '- **Users:** Unlimited (seat-licensed)'
    - '- **Storage:** 100 GB per server'
    - '- **Syncs:** Unlimited + priority queue (faster sync)'
    - '- **Session Logs:** 3 years retained'
    - '- **Support:** Dedicated Slack channel, 4h SLA'
    - '- **Uptime SLA:** 99.9%'
    - '- **Features:** Everything in Team, plus: SSO (OIDC/SAML), SCIM provisioning, advanced RBAC (custom roles), organization-level audit log (exportable), IP allowlist/blocklist, custom webhook secrets, environment isolation (separate staging/prod servers), server templates (provision a new server from a standard config), usage-based billing overages, Jira/Linear integration (for todo sync), bulk server management API'
    - '- **Add-ons:** Data residency options (+$20/user/month for EU-only)'
    - '#### Enterprise Tier — "Enterprise"'
    - '- **Price:** Custom (starting ~$5,000/month for 50 seats; negotiated per contract)'
    - '- **Servers:** Unlimited'
    - '- **Users:** Unlimited'
    - '- **Storage:** Unlimited (object storage, bring-your-own or managed)'
    - '- **Syncs:** Unlimited + dedicated sync workers'
    - '- **Session Logs:** Custom retention (up to indefinite)'
    - '- **Support:** Dedicated customer success manager, 1h critical SLA, onboarding assistance, quarterly business reviews'
    - '- **Uptime SLA:** 99.99% (with dedicated infrastructure)'
    - '- **Features:** Everything in Business, plus: Dedicated infrastructure (no shared tenancy), custom data residency (US, EU, APAC), VPC peering / private link options, custom domain with wildcard SSL, SOC 2 Type II report, HIPAA BAA available, pen test report sharing, custom contract terms, SLA credits, multi-region active-active, custom ingestion connectors (Confluence, Notion, Linear, Jira, GitLab, Bitbucket), advanced analytics and BI data export, white-labeling option (reseller partners)'
    - '- **Procurement:** Annual contracts, PO-based invoicing, net-30 terms'
    - '### 6.3 Add-On Products'
    - '**McpServer Analytics** (future, Year 2+)'
    - '- Aggregated insights across all team servers: most-queried context, most-used tools, AI session patterns'
    - '- Price: $10/user/month add-on'
    - '**McpServer Connect — Slack Integration** (future, Year 2+)'
    - '- Surface todos and sync alerts directly in Slack'
    - '- Price: $5/user/month add-on'
    - '**McpServer Audit Compliance Pack** (future, Year 2+)'
    - '- SOC 2 + HIPAA compliance features: immutable audit logs, access reviews, compliance reports'
    - '- Price: $20/user/month add-on on Business tier; included in Enterprise'
    - '**McpServer On-Premises** (future, Year 3+)'
    - '- Fully air-gapped deployment of the SaaS platform itself on customer infrastructure'
    - '- Price: ~$50K/year license + support'
    - '### 6.4 Free Trial Policy'
    - All paid tiers offer a **14-day free trial** with full feature access. No credit card required for Free and Pro trials; credit card required at checkout for Team and above. Trials that don't convert automatically downgrade to Free tier (servers are paused but data is preserved for 30 days).
    - '---'
    depends-on:
    - saas-04-product-vision
    - saas-05-market-analysis
  - id: saas-08-pricing-strategy
    title: SaaS Business Plan — Business Model & Pricing Strategy
    done: false
    description:
    - '### 7.1 Revenue Model'
    - '**Primary:** Monthly or annual subscription (SaaS recurring revenue). Annual plans at ~17% discount (2 months free).'
    - '**Secondary (future):** Usage-based overages for storage and API calls beyond tier limits.'
    - '**Tertiary (future):** Professional services (onboarding, migration, custom integrations) for Enterprise customers.'
    - '**Open Core:** The core McpServer code remains MIT-licensed on GitHub. The SaaS layer (multi-tenancy, web portal, billing, provisioning) is proprietary. This is the standard open-core SaaS model (HashiCorp, Grafana, GitLab, Sentry, etc.).'
    - '### 7.2 Pricing Rationale'
    - '**Free tier:** Critical for growth. Developers discover the product, use it personally, then advocate for team adoption. The free tier is capped conservatively to ensure conversion pressure without being punitive. The cap on 1 server and 1 user creates natural upgrade triggers.'
    - '**Pro tier ($19/mo):** Priced below psychological resistance ($20) for individual developers. Benchmarked against Railway ($5–20/mo), Render ($25/mo), Fly.io (~$15/mo) for comparable infrastructure. The value is not raw compute but managed McpServer-specific functionality.'
    - '**Team tier ($49/user/mo):** Benchmarked against GitHub Copilot Business ($19/user/mo) and Datadog ($15–75/user/mo). Teams spending $19/user/month on Copilot to get AI assistance should rationally spend $49/user/month to make that AI assistant dramatically more effective.'
    - '**Business tier ($99/user/mo):** SSO and SCIM are table stakes for Enterprise IT. Priced to reflect the procurement overhead and support cost premium. Benchmarked against Notion ($16/user/mo), Linear ($16/user/mo Team, enterprise custom), and Sentry Business ($26/user/mo).'
    - '**Enterprise:** Custom pricing allows us to capture value proportional to ACV and organizational size. Starting floor of ~$5K/month ensures our enterprise sales motion is economically justified.'
    - '### 7.3 Annual vs. Monthly Mix'
    - 'Target 60% annual / 40% monthly by Year 2. Annual plans:'
    - '- Improve cash flow (upfront payment)'
    - '- Reduce churn (customers are committed)'
    - '- Provide pricing incentive (2 months free = 16.7% discount)'
    - '### 7.4 Unit Economics'
    - '**Customer Acquisition Cost (CAC) Targets:**'
    - '- Free → Pro conversion: ~$50 (primarily content/community)'
    - '- Pro → Team upgrade: ~$150 (product-led growth + email nurture)'
    - '- Team → Business (outbound): ~$1,500'
    - '- Enterprise (sales-led): ~$12,000'
    - '**Customer Lifetime Value (LTV) Targets:**'
    - '- Pro (individual): $19/mo × 18-month average lifetime = $342 LTV'
    - '- Team (5-person team): $245/mo × 24-month lifetime = $5,880 LTV'
    - '- Business (20-person org): $1,980/mo × 30-month lifetime = $59,400 LTV'
    - '- Enterprise: $8,000/mo × 36-month lifetime = $288,000 LTV'
    - '**LTV:CAC Ratios:**'
    - '- Pro: 342/50 = 6.8x ✅'
    - '- Team: 5880/150 = 39.2x ✅'
    - '- Business: 59400/1500 = 39.6x ✅'
    - '- Enterprise: 288000/12000 = 24x ✅'
    - All tiers are well above the healthy 3:1 benchmark.
    - '**Infrastructure Cost Per Customer:**'
    - '- Free: ~$0.50/mo (minimal compute, shared infrastructure)'
    - '- Pro: ~$2/mo per server (shared cluster, small pod)'
    - '- Team: ~$8/mo per server (slightly larger, dedicated namespace)'
    - '- Business: ~$15/mo per server (dedicated namespace, faster storage)'
    - '- Enterprise: ~$200/mo per deployment (dedicated nodes)'
    - '**Gross Margin Targets:**'
    - '- Year 1: ~60% (infrastructure costs high during scale-up)'
    - '- Year 2: ~72% (economies of scale, better infrastructure contracts)'
    - '- Year 3: ~78% (mature infrastructure, reduced support cost per customer)'
    - '### 7.5 Expansion Revenue'
    - 'A key metric for healthy SaaS is **Net Revenue Retention (NRR)**. Target NRR of 120%+ by Year 2, driven by:'
    - '- Seat expansion (teams grow, adding more users)'
    - '- Server count expansion (more projects)'
    - '- Tier upgrades (Pro → Team → Business)'
    - '- Storage overage billing'
    - Expansion should contribute ~30% of net new ARR by Year 2.
    - '---'
    depends-on:
    - saas-07-product-offering
    - saas-05-market-analysis
  - id: saas-09-operations-plan
    title: SaaS Business Plan — Operations Plan
    done: false
    description:
    - '### 11.1 Infrastructure (Year 1)'
    - '**Cloud Provider:** Microsoft Azure (primary), with GCP or AWS as secondary for DR.'
    - 'Rationale:'
    - "- .NET 9 / C# is a natural fit for Azure (Microsoft's platform)"
    - '- Azure Kubernetes Service (AKS) is mature'
    - '- Azure Database for PostgreSQL for the control plane'
    - '- Azure Blob Storage for SQLite backups and vector index persistence'
    - '- Azure Container Registry for Docker images'
    - '- GitHub Actions + Azure DevOps pipelines (both available)'
    - '**Kubernetes Architecture:**'
    - '- AKS cluster with auto-scaling node groups'
    - '- Per-customer namespace (or per-customer pod with resource quotas)'
    - '- Dedicated node pools for Enterprise customers'
    - '**Data Infrastructure:**'
    - '- Control plane database: Azure PostgreSQL Flexible Server (HA configuration)'
    - '- Per-server SQLite: stored on Azure Files (NFS-mounted into pod) with hourly snapshots to Azure Blob'
    - '- Vector indices: stored alongside SQLite on Azure Files'
    - '- Blob backup: geo-redundant storage (GRS) for durability'
    - '**Networking:**'
    - '- Azure Application Gateway (layer 7) as main ingress'
    - "- Per-server TLS via Let's Encrypt via cert-manager"
    - '- Wildcard DNS: `*.mcpserver.cloud` → each server gets `{server-slug}.mcpserver.cloud`'
    - '- Private endpoints for database connectivity (no public DB exposure)'
    - '**CDN:** Azure Front Door for web portal static assets and API caching.'
    - '### 11.2 Team Structure (Year 1)'
    - '**Founding team (0–6 months):**'
    - '- CEO/Co-founder: Product, GTM, investor relations, enterprise sales'
    - '- CTO/Co-founder: Architecture, backend, infrastructure, DevOps'
    - '**First hires (Months 4–12):**'
    - '- **Full-Stack Engineer #1** (Month 4): Web portal frontend (React/Next.js); also contributes to .NET backend'
    - '- **DevOps / Platform Engineer** (Month 6): Kubernetes, CI/CD, monitoring, reliability'
    - '- **Full-Stack Engineer #2** (Month 9): Customer-facing features, onboarding improvements, API'
    - '- **Customer Success Manager** (Month 10): Onboarding, retention, enterprise QBRs'
    - '**Months 12–18 (Post-seed):**'
    - '- Sales Development Representative (SDR) #1'
    - '- Full-Stack Engineer #3'
    - '- Security Engineer (part-time/contractor initially)'
    - '- Marketing / Developer Advocate'
    - '### 11.3 Support Operations'
    - '**Tier 1 (Community/Free):** GitHub Discussions, documentation, AI-powered chatbot on website.'
    - '**Tier 2 (Pro/Team):** Email ticketing system (Linear or Zendesk). Target 24–48h response.'
    - '**Tier 3 (Business):** Shared Slack channel. Target 4h response. Dedicated CSM at threshold.'
    - '**Tier 4 (Enterprise):** Dedicated Slack channel + hotline. 1h critical SLA. Monthly check-ins.'
    - '**Support documentation:**'
    - '- Full docs site (docs.mcpserver.cloud) built with DocFX (already in the codebase)'
    - '- Video tutorials for each AI assistant integration'
    - '- Troubleshooting guides for common issues (connection refused, sync failures, embedding errors)'
    - '- Public status page (statuspage.io or Instatus)'
    - '### 11.4 Reliability & SLA Management'
    - '**99.9% uptime SLA** (Team/Business) means < 8.7 hours downtime/year.'
    - '**To achieve this:**'
    - '- Multi-zone AKS cluster (pods distributed across 3 AZs)'
    - '- Health checks and automatic pod restart (Kubernetes liveness/readiness probes)'
    - '- Rolling deployments (zero-downtime deploys)'
    - '- Database failover: Azure PostgreSQL automatic failover < 60s'
    - '- Per-server SQLite: NFS mount with Azure Files ZRS (zone-redundant storage)'
    - '- On-call rotation starting Month 6 (PagerDuty or Opsgenie)'
    - '- Runbooks for all P1 scenarios'
    - '**99.99% uptime SLA** (Enterprise) means < 52 minutes downtime/year.'
    - '**Additional measures for Enterprise:**'
    - '- Dedicated node pools (no shared noisy neighbors)'
    - '- Active-active multi-region option'
    - '- Database read replicas for query offloading'
    - '- Canary deployments before full rollout to Enterprise tenants'
    - '---'
    depends-on:
    - saas-07-product-offering
  - id: saas-10-go-to-market
    title: SaaS Business Plan — Go-to-Market Strategy
    done: false
    description:
    - '### 8.1 Phase 1 — Open Source Community & Developer Awareness'
    - '**Duration:** Pre-launch through Month 6'
    - '**Goal:** Build a community of 1,000 active McpServer open-source users who become the first cloud customers.'
    - '**Tactics:**'
    - 1. **GitHub presence:** McpServer repository should have a polished README, comprehensive documentation, and active issue engagement. Target 1,000 GitHub stars within 3 months of concerted effort.
    - '2. **Hacker News / Show HN:** Launch post with genuine technical depth. HN rewards real engineering work and transparency. A "Show HN: I built a managed MCP context server for AI coding assistants" post targeting front page.'
    - 3. **Reddit:** Engage authentically in r/LocalLLaMA, r/MachineLearning, r/programming, r/golang (though this is .NET, AI tool discussions span languages). Never spam; contribute answers and let the product speak.
    - 4. **Product Hunt launch:** Day-of campaign with coordinated upvotes from early users. Target top 5 in "Developer Tools" category on launch day.
    - 5. **Dev.to / Hashnode / Medium:** Technical blog posts explaining MCP, the context gap in AI assistants, and how McpServer solves it. SEO-optimized for terms like "MCP server hosting", "GitHub Copilot context", "persistent AI memory for developers".
    - '6. **YouTube / Loom demos:** Short (3–5 minute) screen recordings showing: "Set up McpServer Cloud in 5 minutes and instantly make Cursor smarter." Distribute on YouTube, Twitter/X, LinkedIn, Discord.'
    - 7. **Discord & Slack communities:** Join developer AI tool communities (Cursor Discord has 50K+ members), be genuinely helpful, announce McpServer Cloud when relevant.
    - 8. **GitHub Copilot ecosystem:** Engage with GitHub Copilot community. McpServer Cloud is a natural extension for Copilot users. Consider becoming a GitHub Marketplace partner.
    - '### 8.2 Phase 2 — Product-Led Growth Engine'
    - '**Duration:** Months 3–12'
    - '**Goal:** Turn product usage into viral growth. Every team that uses McpServer Cloud should naturally lead to their collaborators discovering it.'
    - '**Tactics:**'
    - 1. **"Powered by McpServer Cloud" attribution:** New servers start with a visible but non-intrusive badge on the server's MCP metadata. When a team member connects their AI assistant and queries context, they see the server name and provider. This is like GitHub's social proof — your work is visible.
    - 2. **GitHub OAuth login:** Using GitHub OAuth means team members show up with their GitHub avatars and usernames. This makes the portal feel familiar and leverages GitHub's social graph.
    - '3. **Invite flows:** When a server owner adds a team member via GitHub handle (@username), that person receives a beautiful email invitation: "Jane has invited you to join [Project Name] on McpServer Cloud."'
    - 4. **Public server pages (optional):** Teams can optionally make their server's index public (listing connected repos, indexed docs, tool configurations) — similar to GitHub profile pages. This creates SEO content and social proof.
    - 5. **"Deploy to McpServer Cloud" button:** Like "Deploy to Heroku" or "Deploy to Railway" buttons, we create a GitHub Action and a button that can be added to any McpServer-compatible open-source project's README. One click → sign up → server provisioned with that repo connected.
    - 6. **Free tier as top-of-funnel:** The free tier is genuinely useful. It turns individual developers into product advocates. When they recommend McpServer Cloud to their team lead, the team lead sees a real use case already in production.
    - "7. **In-product upgrade prompts:** When a free user hits a limit (e.g., 10 syncs/day) with contextual messaging: \"You've hit today's sync limit — upgrade to Pro to sync without limits\" with a one-click upgrade."
    - '### 8.3 Phase 3 — Sales-Assisted Growth for Mid-Market & Enterprise'
    - '**Duration:** Months 9–24'
    - '**Goal:** Close $50K–$240K enterprise contracts. Hire first sales rep at ~$1.2M ARR.'
    - '**Tactics:**'
    - '1. **Inbound-led outbound:** When an enterprise domain (e.g., stripe.com, shopify.com) signs up for a free or Pro account, trigger a personalized outreach from a sales rep: "I noticed several engineers from [Company] are using McpServer Cloud. Happy to discuss an Enterprise plan."'
    - 2. **Account-based marketing (ABM):** Target the Fortune 1000 + top-500 high-growth startups that are known Copilot or Cursor enterprise customers. LinkedIn outreach from technical founders.
    - 3. **Partner channel:** Engage GitHub Enterprise resellers and Microsoft partner ecosystem (McpServer Cloud runs on Azure-compatible infrastructure; Azure Marketplace listing is a future goal).
    - '4. **Conference presence:** Attend and sponsor: GitHub Universe, KubeCon, AWS re:Invent (developer tools track), JetBrains DevEcosystem conference, AI Engineer Summit. Sponsor hackathons with "Best Use of AI Coding Tools" categories.'
    - 5. **Analyst relations:** Brief Gartner, Forrester, and G2 on the AI developer tools market when ARR exceeds $1M. G2 reviews are disproportionately influential in enterprise SaaS purchasing.
    - '6. **Case studies:** Develop 3–5 detailed customer case studies by Month 18, showing measurable productivity gains (reduced context-switching time, faster onboarding, fewer repeated AI prompts). Quantify: "Team reduced average AI prompt setup time from 4 minutes to 30 seconds."'
    - '### 8.4 Partnerships'
    - '**GitHub/Microsoft:** GitHub Copilot Extensions and MCP marketplace listing. Microsoft is investing heavily in the MCP ecosystem and may partner with or acquire tooling providers.'
    - "**Anthropic:** Claude.ai is the primary MCP reference implementation. An official \"Works with Claude\" partnership or listing on Anthropic's MCP directory provides significant credibility."
    - '**Cursor:** Cursor is the fastest-growing AI IDE. An official "Recommended McpServer Provider" listing on cursor.sh would be enormously valuable.'
    - '**Vercel / Railway / Render:** Integration partnerships — "Deploy your McpServer from Railway with one click, or use McpServer Cloud for fully managed hosting."'
    - '---'
    depends-on:
    - saas-07-product-offering
    - saas-08-pricing-strategy
    - saas-06-competitive-landscape
  - id: saas-11-acquisition-retention
    title: SaaS Business Plan — Customer Acquisition & Retention
    done: false
    description:
    - '### 10.1 Acquisition Funnel'
    - '```'
    - Awareness (GitHub stars, blog posts, HN, conferences)
    - '    → Interest (README, docs, demo video, free tier signup)'
    - '        → Activation (first server provisioned, first MCP connection)'
    - '            → Revenue (upgrade to Pro or Team)'
    - '                → Expansion (add team members, add servers)'
    - '                    → Advocacy (referrals, case studies, reviews)'
    - '```'
    - '**Key activation metric:** Time from signup to first successful MCP query from an AI assistant. Target: < 10 minutes.'
    - '### 10.2 Onboarding Flow'
    - 1. GitHub OAuth signup → account created
    - 2. "Create your first server" — pick a repository from GitHub org list
    - 3. Server provisioned in background (~60 seconds)
    - 4. "Connect to your AI assistant" — step-by-step instructions for Cursor, GitHub Copilot, VS Code MCP, Claude desktop
    - 5. "Run your first sync" — one-click sync to index the repository
    - 6. "Ask your AI assistant a question about your codebase" — success screen
    - Every step has a completion indicator. The user cannot get lost because there is only one path.
    - '### 10.3 Retention Strategy'
    - '**Product retention:**'
    - '- Daily active usage naturally comes from the AI assistant querying the server on every coding session. Retention is a function of AI assistant adoption, not direct engagement with our portal.'
    - '- Email digest (weekly): "Your server synced 47 times this week. 3 new todos were created. Last session: 2 hours of context queries."'
    - '- In-portal "Last synced X minutes ago" status promotes habitual checking.'
    - '**Relationship retention:**'
    - "- Monthly \"What's new\" email newsletter for Team and above customers."
    - '- Quarterly usage reviews for Enterprise customers.'
    - '- Proactive support outreach when usage drops >50% week-over-week (possible churn signal).'
    - '**Cancellation prevention:**'
    - '- 30-day data preservation after cancellation. Export-to-zip available.'
    - '- Downgrade option prominently offered before cancellation.'
    - '- Pause option (retain data, no charge) for seasonal users.'
    - '### 10.4 Churn Targets'
    - '- Free tier: N/A (no revenue impact, tracked for health)'
    - '- Pro: Target < 5% monthly churn (= 72-month average lifetime)'
    - '- Team: Target < 3% monthly churn'
    - '- Business/Enterprise: Target < 1% monthly churn'
    - '---'
    depends-on:
    - saas-10-go-to-market
    - saas-08-pricing-strategy
  - id: saas-12-legal-compliance
    title: SaaS Business Plan — Legal, Compliance & Security
    done: false
    description:
    - '### 14.1 Data Privacy'
    - '**GDPR (EU):**'
    - '- Data processing agreement (DPA) available for all paying customers'
    - '- Privacy by design: customer data is isolated per namespace; no cross-tenant access'
    - '- Right to erasure: full data deletion within 30 days of cancellation'
    - '- Data portability: export all data as ZIP (SQLite dump + YAML exports)'
    - '- EU data residency available as add-on (Business) or included (Enterprise)'
    - '**CCPA (California):**'
    - '- Privacy policy explicitly covers CCPA rights'
    - '- No selling customer data (never a business model)'
    - '- Data deletion requests honored within required timeframe'
    - '**HIPAA:**'
    - '- BAA available for Enterprise customers in healthcare'
    - '- Requires dedicated infrastructure tier'
    - '- Audit logging for all data access operations'
    - '### 14.2 Security Posture'
    - '**Authentication:**'
    - '- GitHub OAuth primary (most developers have GitHub accounts)'
    - '- Email/password as fallback (PBKDF2 password hashing, not bcrypt — .NET default)'
    - '- TOTP-based MFA available for all paid tiers; required for Business+'
    - '- SAML 2.0 / OIDC for Enterprise SSO'
    - '**Authorization:**'
    - '- Per-server role-based access control (Admin, Write, Read)'
    - '- API key scoping (read-only, write, admin)'
    - '- Tenant isolation at Kubernetes namespace level'
    - '- Network policies preventing cross-tenant pod communication'
    - '**Data at rest:**'
    - '- SQLite files encrypted at filesystem level (Azure Files encryption at rest — AES-256)'
    - '- Backup blobs encrypted with customer-managed keys (CMK) available for Enterprise'
    - '**Data in transit:**'
    - '- TLS 1.3 minimum for all API traffic'
    - '- Certificate pinning documentation for security-conscious enterprise clients'
    - '**Security operations:**'
    - '- Static analysis in CI/CD pipeline (Snyk, GitHub code scanning)'
    - '- Dependency vulnerability scanning (Dependabot)'
    - '- Penetration test (third-party) before Enterprise GA'
    - '- SOC 2 Type I at Month 12; Type II at Month 24'
    - '### 14.3 Terms of Service & Acceptable Use'
    - '**Key terms:**'
    - '- Customer data is never used for training AI models'
    - '- Customers own all their data'
    - '- Permissible use: software development workflows, personal productivity'
    - '- Prohibited: scraping, automated abuse, storing PII beyond workflow needs, competing product development using McpServer Cloud infrastructure'
    - '- Fair use policy for unlimited tiers (soft limits with communication before enforcement)'
    - '### 14.4 Intellectual Property'
    - '- McpServer core: MIT license (maintained on GitHub)'
    - '- SaaS platform layer: Proprietary'
    - '- Customer data: Customer owns; we have limited license to operate the service'
    - '- Trademarks: Register "McpServer Cloud" and logo before launch in US, EU'
    - '---'
    depends-on:
    - saas-07-product-offering
    - saas-09-operations-plan
