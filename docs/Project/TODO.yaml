    - '- Price: $10/user/month add-on'
    - '**McpServer Connect — Slack Integration** (future, Year 2+)'
    - '- Surface todos and sync alerts directly in Slack'
    - '- Price: $5/user/month add-on'
    - '**McpServer Audit Compliance Pack** (future, Year 2+)'
    - '- SOC 2 + HIPAA compliance features: immutable audit logs, access reviews, compliance reports'
    - '- Price: $20/user/month add-on on Business tier; included in Enterprise'
    - '**McpServer On-Premises** (future, Year 3+)'
    - '- Fully air-gapped deployment of the SaaS platform itself on customer infrastructure'
    - '- Price: ~$50K/year license + support'
    - '### 6.4 Free Trial Policy'
    - All paid tiers offer a **14-day free trial** with full feature access. No credit card required for Free and Pro trials; credit card required at checkout for Team and above. Trials that don't convert automatically downgrade to Free tier (servers are paused but data is preserved for 30 days).
    - '---'
    depends-on:
    - saas-04-product-vision
    - saas-05-market-analysis
  - id: saas-08-pricing-strategy
    title: SaaS Business Plan — Business Model & Pricing Strategy
    done: false
    description:
    - '### 7.1 Revenue Model'
    - '**Primary:** Monthly or annual subscription (SaaS recurring revenue). Annual plans at ~17% discount (2 months free).'
    - '**Secondary (future):** Usage-based overages for storage and API calls beyond tier limits.'
    - '**Tertiary (future):** Professional services (onboarding, migration, custom integrations) for Enterprise customers.'
    - '**Open Core:** The core McpServer code remains MIT-licensed on GitHub. The SaaS layer (multi-tenancy, web portal, billing, provisioning) is proprietary. This is the standard open-core SaaS model (HashiCorp, Grafana, GitLab, Sentry, etc.).'
    - '### 7.2 Pricing Rationale'
    - '**Free tier:** Critical for growth. Developers discover the product, use it personally, then advocate for team adoption. The free tier is capped conservatively to ensure conversion pressure without being punitive. The cap on 1 server and 1 user creates natural upgrade triggers.'
    - '**Pro tier ($19/mo):** Priced below psychological resistance ($20) for individual developers. Benchmarked against Railway ($5–20/mo), Render ($25/mo), Fly.io (~$15/mo) for comparable infrastructure. The value is not raw compute but managed McpServer-specific functionality.'
    - '**Team tier ($49/user/mo):** Benchmarked against GitHub Copilot Business ($19/user/mo) and Datadog ($15–75/user/mo). Teams spending $19/user/month on Copilot to get AI assistance should rationally spend $49/user/month to make that AI assistant dramatically more effective.'
    - '**Business tier ($99/user/mo):** SSO and SCIM are table stakes for Enterprise IT. Priced to reflect the procurement overhead and support cost premium. Benchmarked against Notion ($16/user/mo), Linear ($16/user/mo Team, enterprise custom), and Sentry Business ($26/user/mo).'
    - '**Enterprise:** Custom pricing allows us to capture value proportional to ACV and organizational size. Starting floor of ~$5K/month ensures our enterprise sales motion is economically justified.'
    - '### 7.3 Annual vs. Monthly Mix'
    - 'Target 60% annual / 40% monthly by Year 2. Annual plans:'
    - '- Improve cash flow (upfront payment)'
    - '- Reduce churn (customers are committed)'
    - '- Provide pricing incentive (2 months free = 16.7% discount)'
    - '### 7.4 Unit Economics'
    - '**Customer Acquisition Cost (CAC) Targets:**'
    - '- Free → Pro conversion: ~$50 (primarily content/community)'
    - '- Pro → Team upgrade: ~$150 (product-led growth + email nurture)'
    - '- Team → Business (outbound): ~$1,500'
    - '- Enterprise (sales-led): ~$12,000'
    - '**Customer Lifetime Value (LTV) Targets:**'
    - '- Pro (individual): $19/mo × 18-month average lifetime = $342 LTV'
    - '- Team (5-person team): $245/mo × 24-month lifetime = $5,880 LTV'
    - '- Business (20-person org): $1,980/mo × 30-month lifetime = $59,400 LTV'
    - '- Enterprise: $8,000/mo × 36-month lifetime = $288,000 LTV'
    - '**LTV:CAC Ratios:**'
    - '- Pro: 342/50 = 6.8x ✅'
    - '- Team: 5880/150 = 39.2x ✅'
    - '- Business: 59400/1500 = 39.6x ✅'
    - '- Enterprise: 288000/12000 = 24x ✅'
    - All tiers are well above the healthy 3:1 benchmark.
    - '**Infrastructure Cost Per Customer:**'
    - '- Free: ~$0.50/mo (minimal compute, shared infrastructure)'
    - '- Pro: ~$2/mo per server (shared cluster, small pod)'
    - '- Team: ~$8/mo per server (slightly larger, dedicated namespace)'
    - '- Business: ~$15/mo per server (dedicated namespace, faster storage)'
    - '- Enterprise: ~$200/mo per deployment (dedicated nodes)'
    - '**Gross Margin Targets:**'
    - '- Year 1: ~60% (infrastructure costs high during scale-up)'
    - '- Year 2: ~72% (economies of scale, better infrastructure contracts)'
    - '- Year 3: ~78% (mature infrastructure, reduced support cost per customer)'
    - '### 7.5 Expansion Revenue'
    - 'A key metric for healthy SaaS is **Net Revenue Retention (NRR)**. Target NRR of 120%+ by Year 2, driven by:'
    - '- Seat expansion (teams grow, adding more users)'
    - '- Server count expansion (more projects)'
    - '- Tier upgrades (Pro → Team → Business)'
    - '- Storage overage billing'
    - Expansion should contribute ~30% of net new ARR by Year 2.
    - '---'
    depends-on:
    - saas-07-product-offering
    - saas-05-market-analysis
  - id: saas-09-operations-plan
    title: SaaS Business Plan — Operations Plan
    done: false
    description:
    - '### 11.1 Infrastructure (Year 1)'
    - '**Cloud Provider:** Microsoft Azure (primary), with GCP or AWS as secondary for DR.'
    - 'Rationale:'
    - "- .NET 9 / C# is a natural fit for Azure (Microsoft's platform)"
    - '- Azure Kubernetes Service (AKS) is mature'
    - '- Azure Database for PostgreSQL for the control plane'
    - '- Azure Blob Storage for SQLite backups and vector index persistence'
    - '- Azure Container Registry for Docker images'
    - '- GitHub Actions + Azure DevOps pipelines (both available)'
    - '**Kubernetes Architecture:**'
    - '- AKS cluster with auto-scaling node groups'
    - '- Per-customer namespace (or per-customer pod with resource quotas)'
    - '- Dedicated node pools for Enterprise customers'
    - '**Data Infrastructure:**'
    - '- Control plane database: Azure PostgreSQL Flexible Server (HA configuration)'
    - '- Per-server SQLite: stored on Azure Files (NFS-mounted into pod) with hourly snapshots to Azure Blob'
    - '- Vector indices: stored alongside SQLite on Azure Files'
    - '- Blob backup: geo-redundant storage (GRS) for durability'
    - '**Networking:**'
    - '- Azure Application Gateway (layer 7) as main ingress'
    - "- Per-server TLS via Let's Encrypt via cert-manager"
    - '- Wildcard DNS: `*.mcpserver.cloud` → each server gets `{server-slug}.mcpserver.cloud`'
    - '- Private endpoints for database connectivity (no public DB exposure)'
    - '**CDN:** Azure Front Door for web portal static assets and API caching.'
    - '### 11.2 Team Structure (Year 1)'
    - '**Founding team (0–6 months):**'
    - '- CEO/Co-founder: Product, GTM, investor relations, enterprise sales'
    - '- CTO/Co-founder: Architecture, backend, infrastructure, DevOps'
    - '**First hires (Months 4–12):**'
    - '- **Full-Stack Engineer #1** (Month 4): Web portal frontend (React/Next.js); also contributes to .NET backend'
    - '- **DevOps / Platform Engineer** (Month 6): Kubernetes, CI/CD, monitoring, reliability'
    - '- **Full-Stack Engineer #2** (Month 9): Customer-facing features, onboarding improvements, API'
    - '- **Customer Success Manager** (Month 10): Onboarding, retention, enterprise QBRs'
    - '**Months 12–18 (Post-seed):**'
    - '- Sales Development Representative (SDR) #1'
    - '- Full-Stack Engineer #3'
    - '- Security Engineer (part-time/contractor initially)'
    - '- Marketing / Developer Advocate'
    - '### 11.3 Support Operations'
    - '**Tier 1 (Community/Free):** GitHub Discussions, documentation, AI-powered chatbot on website.'
    - '**Tier 2 (Pro/Team):** Email ticketing system (Linear or Zendesk). Target 24–48h response.'
    - '**Tier 3 (Business):** Shared Slack channel. Target 4h response. Dedicated CSM at threshold.'
    - '**Tier 4 (Enterprise):** Dedicated Slack channel + hotline. 1h critical SLA. Monthly check-ins.'
    - '**Support documentation:**'
    - '- Full docs site (docs.mcpserver.cloud) built with DocFX (already in the codebase)'
    - '- Video tutorials for each AI assistant integration'
    - '- Troubleshooting guides for common issues (connection refused, sync failures, embedding errors)'
    - '- Public status page (statuspage.io or Instatus)'
    - '### 11.4 Reliability & SLA Management'
    - '**99.9% uptime SLA** (Team/Business) means < 8.7 hours downtime/year.'
    - '**To achieve this:**'
    - '- Multi-zone AKS cluster (pods distributed across 3 AZs)'
    - '- Health checks and automatic pod restart (Kubernetes liveness/readiness probes)'
    - '- Rolling deployments (zero-downtime deploys)'
    - '- Database failover: Azure PostgreSQL automatic failover < 60s'
    - '- Per-server SQLite: NFS mount with Azure Files ZRS (zone-redundant storage)'
    - '- On-call rotation starting Month 6 (PagerDuty or Opsgenie)'
    - '- Runbooks for all P1 scenarios'
    - '**99.99% uptime SLA** (Enterprise) means < 52 minutes downtime/year.'
    - '**Additional measures for Enterprise:**'
    - '- Dedicated node pools (no shared noisy neighbors)'
    - '- Active-active multi-region option'
    - '- Database read replicas for query offloading'
    - '- Canary deployments before full rollout to Enterprise tenants'
    - '---'
    depends-on:
    - saas-07-product-offering
  - id: saas-10-go-to-market
    title: SaaS Business Plan — Go-to-Market Strategy
    done: false
    description:
    - '### 8.1 Phase 1 — Open Source Community & Developer Awareness'
    - '**Duration:** Pre-launch through Month 6'
    - '**Goal:** Build a community of 1,000 active McpServer open-source users who become the first cloud customers.'
    - '**Tactics:**'
    - 1. **GitHub presence:** McpServer repository should have a polished README, comprehensive documentation, and active issue engagement. Target 1,000 GitHub stars within 3 months of concerted effort.
    - '2. **Hacker News / Show HN:** Launch post with genuine technical depth. HN rewards real engineering work and transparency. A "Show HN: I built a managed MCP context server for AI coding assistants" post targeting front page.'
    - 3. **Reddit:** Engage authentically in r/LocalLLaMA, r/MachineLearning, r/programming, r/golang (though this is .NET, AI tool discussions span languages). Never spam; contribute answers and let the product speak.
    - 4. **Product Hunt launch:** Day-of campaign with coordinated upvotes from early users. Target top 5 in "Developer Tools" category on launch day.
    - 5. **Dev.to / Hashnode / Medium:** Technical blog posts explaining MCP, the context gap in AI assistants, and how McpServer solves it. SEO-optimized for terms like "MCP server hosting", "GitHub Copilot context", "persistent AI memory for developers".
    - '6. **YouTube / Loom demos:** Short (3–5 minute) screen recordings showing: "Set up McpServer Cloud in 5 minutes and instantly make Cursor smarter." Distribute on YouTube, Twitter/X, LinkedIn, Discord.'
    - 7. **Discord & Slack communities:** Join developer AI tool communities (Cursor Discord has 50K+ members), be genuinely helpful, announce McpServer Cloud when relevant.
    - 8. **GitHub Copilot ecosystem:** Engage with GitHub Copilot community. McpServer Cloud is a natural extension for Copilot users. Consider becoming a GitHub Marketplace partner.
    - '### 8.2 Phase 2 — Product-Led Growth Engine'
    - '**Duration:** Months 3–12'
    - '**Goal:** Turn product usage into viral growth. Every team that uses McpServer Cloud should naturally lead to their collaborators discovering it.'
    - '**Tactics:**'
    - 1. **"Powered by McpServer Cloud" attribution:** New servers start with a visible but non-intrusive badge on the server's MCP metadata. When a team member connects their AI assistant and queries context, they see the server name and provider. This is like GitHub's social proof — your work is visible.
    - 2. **GitHub OAuth login:** Using GitHub OAuth means team members show up with their GitHub avatars and usernames. This makes the portal feel familiar and leverages GitHub's social graph.
    - '3. **Invite flows:** When a server owner adds a team member via GitHub handle (@username), that person receives a beautiful email invitation: "Jane has invited you to join [Project Name] on McpServer Cloud."'
    - 4. **Public server pages (optional):** Teams can optionally make their server's index public (listing connected repos, indexed docs, tool configurations) — similar to GitHub profile pages. This creates SEO content and social proof.
    - 5. **"Deploy to McpServer Cloud" button:** Like "Deploy to Heroku" or "Deploy to Railway" buttons, we create a GitHub Action and a button that can be added to any McpServer-compatible open-source project's README. One click → sign up → server provisioned with that repo connected.
    - 6. **Free tier as top-of-funnel:** The free tier is genuinely useful. It turns individual developers into product advocates. When they recommend McpServer Cloud to their team lead, the team lead sees a real use case already in production.
    - "7. **In-product upgrade prompts:** When a free user hits a limit (e.g., 10 syncs/day) with contextual messaging: \"You've hit today's sync limit — upgrade to Pro to sync without limits\" with a one-click upgrade."
    - '### 8.3 Phase 3 — Sales-Assisted Growth for Mid-Market & Enterprise'
    - '**Duration:** Months 9–24'
    - '**Goal:** Close $50K–$240K enterprise contracts. Hire first sales rep at ~$1.2M ARR.'
    - '**Tactics:**'
    - '1. **Inbound-led outbound:** When an enterprise domain (e.g., stripe.com, shopify.com) signs up for a free or Pro account, trigger a personalized outreach from a sales rep: "I noticed several engineers from [Company] are using McpServer Cloud. Happy to discuss an Enterprise plan."'
    - 2. **Account-based marketing (ABM):** Target the Fortune 1000 + top-500 high-growth startups that are known Copilot or Cursor enterprise customers. LinkedIn outreach from technical founders.
    - 3. **Partner channel:** Engage GitHub Enterprise resellers and Microsoft partner ecosystem (McpServer Cloud runs on Azure-compatible infrastructure; Azure Marketplace listing is a future goal).
    - '4. **Conference presence:** Attend and sponsor: GitHub Universe, KubeCon, AWS re:Invent (developer tools track), JetBrains DevEcosystem conference, AI Engineer Summit. Sponsor hackathons with "Best Use of AI Coding Tools" categories.'
    - 5. **Analyst relations:** Brief Gartner, Forrester, and G2 on the AI developer tools market when ARR exceeds $1M. G2 reviews are disproportionately influential in enterprise SaaS purchasing.
    - '6. **Case studies:** Develop 3–5 detailed customer case studies by Month 18, showing measurable productivity gains (reduced context-switching time, faster onboarding, fewer repeated AI prompts). Quantify: "Team reduced average AI prompt setup time from 4 minutes to 30 seconds."'
    - '### 8.4 Partnerships'
    - '**GitHub/Microsoft:** GitHub Copilot Extensions and MCP marketplace listing. Microsoft is investing heavily in the MCP ecosystem and may partner with or acquire tooling providers.'
    - "**Anthropic:** Claude.ai is the primary MCP reference implementation. An official \"Works with Claude\" partnership or listing on Anthropic's MCP directory provides significant credibility."
    - '**Cursor:** Cursor is the fastest-growing AI IDE. An official "Recommended McpServer Provider" listing on cursor.sh would be enormously valuable.'
    - '**Vercel / Railway / Render:** Integration partnerships — "Deploy your McpServer from Railway with one click, or use McpServer Cloud for fully managed hosting."'
    - '---'
    depends-on:
    - saas-07-product-offering
    - saas-08-pricing-strategy
    - saas-06-competitive-landscape
  - id: saas-11-acquisition-retention
    title: SaaS Business Plan — Customer Acquisition & Retention
    done: false
    description:
    - '### 10.1 Acquisition Funnel'
    - '```'
    - Awareness (GitHub stars, blog posts, HN, conferences)
    - '    → Interest (README, docs, demo video, free tier signup)'
    - '        → Activation (first server provisioned, first MCP connection)'
    - '            → Revenue (upgrade to Pro or Team)'
    - '                → Expansion (add team members, add servers)'
    - '                    → Advocacy (referrals, case studies, reviews)'
    - '```'
    - '**Key activation metric:** Time from signup to first successful MCP query from an AI assistant. Target: < 10 minutes.'
    - '### 10.2 Onboarding Flow'
    - 1. GitHub OAuth signup → account created
    - 2. "Create your first server" — pick a repository from GitHub org list
    - 3. Server provisioned in background (~60 seconds)
    - 4. "Connect to your AI assistant" — step-by-step instructions for Cursor, GitHub Copilot, VS Code MCP, Claude desktop
    - 5. "Run your first sync" — one-click sync to index the repository
    - 6. "Ask your AI assistant a question about your codebase" — success screen
    - Every step has a completion indicator. The user cannot get lost because there is only one path.
    - '### 10.3 Retention Strategy'
    - '**Product retention:**'
    - '- Daily active usage naturally comes from the AI assistant querying the server on every coding session. Retention is a function of AI assistant adoption, not direct engagement with our portal.'
    - '- Email digest (weekly): "Your server synced 47 times this week. 3 new todos were created. Last session: 2 hours of context queries."'
    - '- In-portal "Last synced X minutes ago" status promotes habitual checking.'
    - '**Relationship retention:**'
    - "- Monthly \"What's new\" email newsletter for Team and above customers."
    - '- Quarterly usage reviews for Enterprise customers.'
    - '- Proactive support outreach when usage drops >50% week-over-week (possible churn signal).'
    - '**Cancellation prevention:**'
    - '- 30-day data preservation after cancellation. Export-to-zip available.'
    - '- Downgrade option prominently offered before cancellation.'
    - '- Pause option (retain data, no charge) for seasonal users.'
    - '### 10.4 Churn Targets'
    - '- Free tier: N/A (no revenue impact, tracked for health)'
    - '- Pro: Target < 5% monthly churn (= 72-month average lifetime)'
    - '- Team: Target < 3% monthly churn'
    - '- Business/Enterprise: Target < 1% monthly churn'
    - '---'
    depends-on:
    - saas-10-go-to-market
    - saas-08-pricing-strategy
  - id: saas-12-legal-compliance
    title: SaaS Business Plan — Legal, Compliance & Security
    done: false
    description:
    - '### 14.1 Data Privacy'
    - '**GDPR (EU):**'
    - '- Data processing agreement (DPA) available for all paying customers'
    - '- Privacy by design: customer data is isolated per namespace; no cross-tenant access'
    - '- Right to erasure: full data deletion within 30 days of cancellation'
    - '- Data portability: export all data as ZIP (SQLite dump + YAML exports)'
    - '- EU data residency available as add-on (Business) or included (Enterprise)'
    - '**CCPA (California):**'
    - '- Privacy policy explicitly covers CCPA rights'
    - '- No selling customer data (never a business model)'
    - '- Data deletion requests honored within required timeframe'
    - '**HIPAA:**'
    - '- BAA available for Enterprise customers in healthcare'
    - '- Requires dedicated infrastructure tier'
    - '- Audit logging for all data access operations'
    - '### 14.2 Security Posture'
    - '**Authentication:**'
    - '- GitHub OAuth primary (most developers have GitHub accounts)'
    - '- Email/password as fallback (PBKDF2 password hashing, not bcrypt — .NET default)'
    - '- TOTP-based MFA available for all paid tiers; required for Business+'
    - '- SAML 2.0 / OIDC for Enterprise SSO'
    - '**Authorization:**'
    - '- Per-server role-based access control (Admin, Write, Read)'
    - '- API key scoping (read-only, write, admin)'
    - '- Tenant isolation at Kubernetes namespace level'
    - '- Network policies preventing cross-tenant pod communication'
    - '**Data at rest:**'
    - '- SQLite files encrypted at filesystem level (Azure Files encryption at rest — AES-256)'
    - '- Backup blobs encrypted with customer-managed keys (CMK) available for Enterprise'
    - '**Data in transit:**'
    - '- TLS 1.3 minimum for all API traffic'
    - '- Certificate pinning documentation for security-conscious enterprise clients'
    - '**Security operations:**'
    - '- Static analysis in CI/CD pipeline (Snyk, GitHub code scanning)'
    - '- Dependency vulnerability scanning (Dependabot)'
    - '- Penetration test (third-party) before Enterprise GA'
    - '- SOC 2 Type I at Month 12; Type II at Month 24'
    - '### 14.3 Terms of Service & Acceptable Use'
    - '**Key terms:**'
    - '- Customer data is never used for training AI models'
    - '- Customers own all their data'
    - '- Permissible use: software development workflows, personal productivity'
    - '- Prohibited: scraping, automated abuse, storing PII beyond workflow needs, competing product development using McpServer Cloud infrastructure'
    - '- Fair use policy for unlimited tiers (soft limits with communication before enforcement)'
    - '### 14.4 Intellectual Property'
    - '- McpServer core: MIT license (maintained on GitHub)'
    - '- SaaS platform layer: Proprietary'
    - '- Customer data: Customer owns; we have limited license to operate the service'
    - '- Trademarks: Register "McpServer Cloud" and logo before launch in US, EU'
    - '---'
    depends-on:
    - saas-07-product-offering
    - saas-09-operations-plan
