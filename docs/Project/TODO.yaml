  - id: android-oidc-proxy-routes
    title: OIDC proxy routes on MCP server for Android device flow
    note: Android can reach MCP server on :7147 but may not be able to reach Keycloak directly on :7080. Add MCP-hosted OIDC proxy routes so Android device-flow traffic stays on :7147.
    done: false
    description:
    - 'Expose MCP-server OIDC proxy routes for Android app use: GET /auth/config, POST /auth/device, and POST /auth/token.'
    - Android app should call MCP on :7147 only; MCP server forwards OIDC requests to Keycloak (:7080) and returns equivalent responses.
    - This fixes the current failure mode where /auth/config succeeds on :7147 but token polling later fails when Android tries to connect directly to Keycloak on :7080.
    technical-details:
    - MCP proxy routes are server endpoints, not Android-side rewrites. The server must forward device authorization and token polling requests to Keycloak using configured OIDC authority/realm endpoints.
    - Preserve OIDC response payloads/status codes so Android device-flow polling logic continues to work unchanged except for base URL (:7147 instead of :7080).
    - 'Route examples: GET /auth/config (local metadata), POST /auth/device (proxy to Keycloak device authorization endpoint), POST /auth/token (proxy to Keycloak token endpoint).'
