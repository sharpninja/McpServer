      done: false
    - task: '[Phase 1 — Scaffolding] Create src/McpServer.Client/README.md with usage examples (included in NuGet package)'
      done: false
    - task: '[Phase 1 — Scaffolding] Configure GenerateDocumentationFile=true, verify dotnet build and dotnet pack succeed locally'
      done: false
