    - task: '[Commit 1 - MVP] Update src/McpServer.Support.Mcp/Services/FrpTunnelProvider.cs to prefer PublicBaseUrl when building TunnelStatus.PublicUrl, then fall back to CustomDomain/Subdomain behavior'
