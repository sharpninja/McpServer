requirements-management:
  high-priority:
  - id: REQ-MGMT-001
    title: Requirements Management Feature - CRUD + document generation endpoints
    estimate: 4-6 days
    note: 'High priority - builds on FR-MCP-023 (AI requirements analysis). This TODO intentionally uses a non-FR ID because FR-MCP-026 was reassigned to OIDC authentication in the requirements docs. Provides a first-class Requirements Management subsystem: in-memory model loaded from the four canonical docs, full CRUD for FR/TR/TEST entries, and REST + MCP tool endpoints to regenerate any or all four documents in their exact established Markdown format (individually or as a ZIP).'
    done: true
    completed: 2026-02-26
    description:
    - 'Create a RequirementsManagementController with REST endpoints for CRUD on Functional Requirements (FR), Technical Requirements (TR), and Testing Requirements (TEST) entries, backed by the four canonical files: Functional-Requirements.md, Technical-Requirements.md, Testing-Requirements.md, and TR-per-FR-Mapping.md.'
    - Add a document generation endpoint GET /mcpserver/requirements/generate?doc={functional|technical| testing|mapping|all} that renders requirements documents as Markdown (text/markdown) matching the exact established structure, or as a ZIP archive when doc=all.
    - 'Expose five MCP tools: requirements_generate, requirements_list, requirements_create, requirements_update, requirements_delete - enabling AI agents to manage requirements and generate up-to-date documentation directly from a conversation.'
    - On startup, parse all four document files into a strongly-typed in-memory model and keep it synchronized with file writes on every mutating operation.
    done-summary: Implemented requirements document parsing/rendering service, REST CRUD + generate endpoints, STDIO MCP tools, DI/config wiring, and focused service/controller tests.
    technical-details:
    - 'New project component: RequirementsManagementController at src/McpServer.Support.Mcp/Controllers/RequirementsController.cs'
    - 'RequirementsDocumentService - parses Functional-Requirements.md (## FR-{ID}\n\n{title}\n\n{body}), Technical-Requirements.md (## TR-{ID}\n\n**{title}** - {body}), Testing-Requirements.md (bullet list: - TEST-{ID}: {condition} format), and TR-per-FR-Mapping.md (Markdown table). Exposes IRequirementsDocumentService with typed CRUD and generation methods.'
    - IRequirementsRepository - file-backed persistence using SemaphoreSlim for write serialization. Each mutating call updates the in-memory model then atomically writes the affected file via File.WriteAllTextAsync to a temp path followed by File.Replace (atomic swap).
    - RequirementsDocumentRenderer - RenderFunctional(), RenderTechnical(), RenderTesting(), RenderMapping(), RenderAll(). RenderAll() uses System.IO.Compression.ZipArchive to produce a single in-memory ZIP containing all four files with their canonical filenames.
    - 'Sub-resources: POST/GET /mcpserver/requirements/fr, GET/PUT/DELETE /mcpserver/requirements/fr/{id}; same pattern for /tr/{id} and /test/{id}. GET /mcpserver/requirements/mapping for the full table. GET /mcpserver/requirements/generate?doc= for document output.'
    - 'MCP tools (added to McpServerMcpTools.cs): requirements_generate(doc), requirements_list(type), requirements_create(type, id, title, body), requirements_update(type, id, title?, body?), requirements_delete(type, id).'
    - 'Document file paths resolved relative to RepoRoot via IOptions<RequirementsOptions>. Default paths: docs/Project/Functional-Requirements.md, docs/Project/Technical-Requirements.md, docs/Project/Testing-Requirements.md, docs/Project/TR-per-FR-Mapping.md. Configurable via Mcp:Requirements:* config section.'
    - All public types require XML doc comments (CS1591 enforced as error in this repo).
    - ApiKeyAuthFilter is no longer used; all /mcpserver/* routes are protected by WorkspaceAuthMiddleware at the pipeline level. No per-controller auth attributes needed.
    functional-requirements:
    - 'FR-MCP-040: Server shall support CRUD for FR, TR, and TEST requirement entries stored in the four canonical project documentation files.'
    - 'FR-MCP-041: Server shall expose a document generation endpoint rendering any or all four requirements documents in their established Markdown format.'
    - 'FR-MCP-042: Server shall expose MCP tools for requirements CRUD and document generation usable by AI agents.'
    technical-requirements:
    - 'TR-MCP-REQ-002: RequirementsDocumentService parses all four files into a typed in-memory model on startup and keeps files synchronized on mutation.'
    - 'TR-MCP-REQ-002: RequirementsDocumentRenderer produces Markdown output matching exact heading style and bullet/table structure of each canonical document.'
    - 'TR-MCP-REQ-002: doc=all returns application/zip containing all four files; individual doc values return text/markdown.'
    - 'TR-MCP-REQ-002: Write operations use atomic file swap (temp + File.Replace) and SemaphoreSlim serialization to prevent corruption.'
    implementation-tasks:
    - task: '[Phase 1 - Model] Define FrEntry(Id, Title, Body), TrEntry(Id, Title, Body), TestEntry(Id, Condition), FrTrMapping(FrId, TrIds) records in Requirements/Models/'
      done: true
    - task: '[Phase 1 - Model] Define IRequirementsRepository with GetAllFrAsync, GetFrAsync, AddFrAsync, UpdateFrAsync, DeleteFrAsync (same for Tr/Test/Mapping)'
      done: true
    - task: '[Phase 1 - Model] Define IRequirementsDocumentService extending IRequirementsRepository plus GenerateDocumentAsync(RequirementsDocType), GenerateAllAsync()'
      done: true
    - task: '[Phase 2 - Parsing] Implement FunctionalRequirementsParser: regex ## (FR-[A-Z]+-\d+)\s+\n+\*\*?(.+?)\*\*?\s+-?\s+([\s\S]+?)(?=\n## |\z) to extract Id/Title/Body'
      done: true
    - task: '[Phase 2 - Parsing] Implement TechnicalRequirementsParser: same ## heading pattern, bold title with em-dash separator convention'
      done: true
    - task: '[Phase 2 - Parsing] Implement TestingRequirementsParser: bullet list pattern - (TEST-[A-Z]+-\d+): (.+) per line'
      done: true
    - task: '[Phase 2 - Parsing] Implement MappingParser: Markdown table rows | FR-id | TR-ids | with comma-separated TR IDs per cell'
      done: true
    - task: '[Phase 3 - Renderer] Implement RequirementsDocumentRenderer.RenderFunctional(IEnumerable<FrEntry>): # Functional Requirements (MCP Server)\n\n## {Id}\n\n{Title}\n\n{Body}\n\n'
      done: true
    - task: '[Phase 3 - Renderer] Implement RenderTechnical(IEnumerable<TrEntry>): ## {Id}\n\n**{Title}** - {Body}\n\n'
      done: true
    - task: '[Phase 3 - Renderer] Implement RenderTesting(IEnumerable<TestEntry>): # Testing Requirements (MCP Server)\n\n- {Id}: {Condition}\n per entry'
      done: true
    - task: '[Phase 3 - Renderer] Implement RenderMapping(IEnumerable<FrTrMapping>): | FR | Primary TRs |\n| --- | --- |\n| {FrId} | {TrIds joined by ", "} |'
      done: true
    - task: '[Phase 3 - Renderer] Implement RenderAll(): create MemoryStream + ZipArchive, add all four rendered documents as entries with canonical filenames'
      done: true
    - task: '[Phase 4 - Service] Implement RequirementsDocumentService: constructor reads all four files via IRequirementsRepository, populates _frEntries/_trEntries/_testEntries/_mappings ConcurrentDictionary'
      done: true
    - task: '[Phase 4 - Service] Implement atomic file write: write to {path}.tmp, then File.Replace(tmp, target, backup: null) under SemaphoreSlim'
      done: true
    - task: '[Phase 4 - Service] Implement GenerateDocumentAsync(RequirementsDocType): switch on enum, call appropriate renderer, return (content, mimeType) tuple'
      done: true
    - task: '[Phase 4 - Service] Implement GenerateAllAsync(): call RenderAll(), return MemoryStream'
      done: true
    - task: '[Phase 5 - Controller] Implement RequirementsController: GET/POST /mcpserver/requirements/fr, GET/PUT/DELETE /mcpserver/requirements/fr/{id} (same pattern for /tr and /test)'
      done: true
    - task: '[Phase 5 - Controller] Add GET /mcpserver/requirements/generate?doc= endpoint: parse enum, call GenerateDocumentAsync or GenerateAllAsync, set Content-Disposition attachment header'
      done: true
    - task: '[Phase 5 - Controller] Add GET /mcpserver/requirements/mapping and PUT /mcpserver/requirements/mapping/{frId} for the TR-per-FR table'
      done: true
    - task: '[Phase 5 - Controller] Auth is handled by WorkspaceAuthMiddleware at the pipeline level - no per-action attributes needed'
      done: true
    - task: '[Phase 5 - Controller] Add full XML doc comments on all controller actions and parameters'
      done: true
    - task: '[Phase 6 - MCP Tools] Add [McpServerTool] requirements_list(string type) to McpServerMcpTools.cs: returns JSON array of matching entries'
      done: true
    - task: '[Phase 6 - MCP Tools] Add [McpServerTool] requirements_generate(string doc) to McpServerMcpTools.cs: returns Markdown string for specified doc type (all returns concatenated with --- separators)'
      done: true
    - task: '[Phase 6 - MCP Tools] Add [McpServerTool] requirements_create(string type, string id, string title, string body) with XML docs'
      done: true
    - task: '[Phase 6 - MCP Tools] Add [McpServerTool] requirements_update(string type, string id, string? title, string? body) with XML docs'
      done: true
    - task: '[Phase 6 - MCP Tools] Add [McpServerTool] requirements_delete(string type, string id) with XML docs'
      done: true
    - task: '[Phase 7 - Config] Add RequirementsOptions bound to Mcp:Requirements with FunctionalRequirementsPath, TechnicalRequirementsPath, TestingRequirementsPath, MappingPath (all defaulting to docs/Project/*.md relative to RepoRoot)'
      done: true
    - task: '[Phase 7 - Config] Register IRequirementsDocumentService, IRequirementsRepository in Program.cs DI'
      done: true
    - task: '[Phase 8 - Tests] Unit tests for each parser: given canonical file content, when parsed, then all entries are correctly extracted with right IDs, titles, and bodies'
      done: true
    - task: '[Phase 8 - Tests] Unit tests for each renderer: given typed entries, when rendered, then output matches expected Markdown structure exactly (heading level, bold format, bullet syntax)'
      done: true
    - task: '[Phase 8 - Tests] Integration test: POST /mcpserver/requirements/fr creates entry → GET /mcpserver/requirements/generate?doc=functional contains new entry → DELETE removes it → generate no longer contains it'
      done: true
    - task: '[Phase 8 - Tests] Integration test: GET /mcpserver/requirements/generate?doc=all returns 200 application/zip with four entries matching canonical filenames'
      done: true
    - task: '[Phase 8 - Tests] Test atomic write: simulate concurrent mutations, verify file integrity after all complete'
      done: true
staging-and-infrastructure:
  high-priority:
  - id: nuget-client-lib
    title: Create REST client library and NuGet package with publish pipeline
    estimate: 3-5 days
    note: 'Implemented: McpServer.Client library with 8 sub-clients covering all 52+ API endpoints, typed DTOs, exception hierarchy, DI integration, factory pattern, 35 unit tests, CI pipeline with NuGet publish (main→nuget.org, other→GitHub Packages).'
    done: true
    description:
    - Create a typed REST client library (McpServer.Client) wrapping all 52 MCP Server API endpoints across 8 controllers
    - Package as SharpNinja.McpServer.Client for nuget.org distribution
    - 'Add publish-to-NuGet stage in CI pipeline: main branch publishes to nuget.org, develop/other branches publish to GitHub NuGet repository'
    - Include DI extension method AddMcpServerClient() for easy ASP.NET Core integration
    - Full XML-doc coverage and README with usage examples
    technical-details:
    - 'Target frameworks: net9.0;netstandard2.0 (multi-target for broad compatibility)'
    - 'Dependencies: System.Net.Http.Json, System.Text.Json, Microsoft.Extensions.DependencyInjection.Abstractions, Microsoft.Extensions.Http, Microsoft.Extensions.Options'
    - 'Project path: src/McpServer.Client/McpServer.Client.csproj'
    - 'PackageId: SharpNinja.McpServer.Client'
    - 'Version source: .version file + -preview.{buildnumber} suffix for non-main branches'
    - SourceLink enabled via Directory.Build.props (already configured for deterministic builds)
    - HttpClient-based with IHttpClientFactory integration for proper connection pooling
    - System.Text.Json source generators for AOT-compatible serialization (McpJsonContext)
    - All response types use records for immutability
    - CancellationToken on every async method
    - Nullable reference types enabled
    - API key passed via X-Api-Key header (configurable via McpServerClientOptions)
    functional-requirements:
    - 'FR-01: Client must expose typed methods for all 52 API endpoints across 8 controllers'
    - 'FR-02: All methods must be async and accept CancellationToken'
    - 'FR-03: Client must support API key authentication for protected endpoints (tools write operations)'
    - 'FR-04: Client must support configurable base URL for multi-instance deployments'
    - 'FR-05: Client must deserialize all response types to strongly-typed DTOs'
    - 'FR-06: Client must throw typed exceptions for HTTP error responses (400→McpValidationException with errors dict, 404→McpNotFoundException, 401→McpUnauthorizedException, 500→McpServerException)'
    - 'FR-07: Client must support both DI (AddMcpServerClient) and manual instantiation (McpServerClientFactory)'
    - 'FR-08: Package must work on net9.0 and netstandard2.0 consumers'
    - 'FR-09: CI must publish stable packages to nuget.org from main branch only'
    - 'FR-10: CI must publish preview packages to GitHub Packages from develop/feature branches'
