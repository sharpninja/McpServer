      done: true
    - task: '[Phase 3 — Renderer] Implement RenderTesting(IEnumerable<TestEntry>): # Testing Requirements (MCP Server)\n\n- {Id}: {Condition}\n per entry'
      done: true
    - task: '[Phase 3 — Renderer] Implement RenderMapping(IEnumerable<FrTrMapping>): | FR | Primary TRs |\n| --- | --- |\n| {FrId} | {TrIds joined by ", "} |'
      done: true
    - task: '[Phase 3 — Renderer] Implement RenderAll(): create MemoryStream + ZipArchive, add all four rendered documents as entries with canonical filenames'
      done: true
    - task: '[Phase 4 — Service] Implement RequirementsDocumentService: constructor reads all four files via IRequirementsRepository, populates _frEntries/_trEntries/_testEntries/_mappings ConcurrentDictionary'
      done: true
    - task: '[Phase 4 — Service] Implement atomic file write: write to {path}.tmp, then File.Replace(tmp, target, backup: null) under SemaphoreSlim'
      done: true
    - task: '[Phase 4 — Service] Implement GenerateDocumentAsync(RequirementsDocType): switch on enum, call appropriate renderer, return (content, mimeType) tuple'
      done: true
