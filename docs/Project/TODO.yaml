      done: true
    - task: '[Phase 5 — Controller] Auth is handled by WorkspaceAuthMiddleware at the pipeline level — no per-action attributes needed'
      done: true
    - task: '[Phase 5 — Controller] Add full XML doc comments on all controller actions and parameters'
      done: true
    - task: '[Phase 6 — MCP Tools] Add [McpServerTool] requirements_list(string type) to McpServerMcpTools.cs: returns JSON array of matching entries'
      done: true
