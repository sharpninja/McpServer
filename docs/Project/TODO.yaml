      done: false
    - task: '[Phase 2 — DTOs] TodoModels.cs: TodoFlatItem, TodoFlatTask, TodoCreateRequest, TodoUpdateRequest, TodoQueryResult, TodoMutationResult, TodoQueryRequest'
