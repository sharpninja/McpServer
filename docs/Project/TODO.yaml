  - id: frp-railway-tunnel
    title: FRP tunnel provider hardening and Railway-hosted frps deployment assets (superseded for Railway multi-port exposure)
    estimate: 2-4 days
    note: FRP tunnel provider work was completed, but the Railway deployment strategy is no longer the preferred path for this environment because Railway does not support the required multi-public-port exposure model (7147-7160). Keep FRP support for non-Railway scenarios; use ngrok/cloudflare strategies for this environment.
    done: true
    description:
    - Use the existing FRP provider (frpc) in McpServer.Support.Mcp and make it production-ready for Railway-hosted frps.
    - Support a simple MVP deployment path first (HTTP mode), then add hardening and operational visibility.
    - Provide Railway deployment assets and a runbook so a local MCP instance can connect to a self-hosted frps service.
    technical-details:
    - 'Existing integration points: src/McpServer.Support.Mcp/Services/FrpTunnelProvider.cs, src/McpServer.Support.Mcp/Options/TunnelOptions.cs, src/McpServer.Support.Mcp/Program.cs.'
    - MVP should preserve backward compatibility with current Mcp:Tunnel:Frp settings (ServerAddress, ServerPort, Token, Subdomain, CustomDomain).
    - 'Add Railway-focused options only as needed (for example: PublicBaseUrl, StartupTimeoutSeconds, ProxyType).'
    - Prefer HTTP proxy mode first because current FrpTunnelProvider.GenerateConfig() already emits FRP HTTP config.
    - Secrets (FRP token) must not be logged or written to committed files.
    implementation-tasks:
    - task: '[Commit 1 - MVP] Extend FrpTunnelOptions in src/McpServer.Support.Mcp/Options/TunnelOptions.cs with Railway-ready fields (PublicBaseUrl, StartupTimeoutSeconds, ProxyType defaulting to http) while keeping existing options backward compatible'
