  - id: ngrok-tunnel-strategy
    title: ngrok tunnel strategy for MCP remote/mobile access in single-public-port environments
    estimate: 1-2 days
    note: ngrok provider already exists (NgrokTunnelProvider). This strategy is the preferred managed-tunnel path when the hosting/network environment does not support exposing multiple public ports.
    done: true
    description:
    - Use the existing ngrok provider in McpServer.Support.Mcp for the primary MCP host endpoint on port 7147.
    - 'Strategy decision: single-public-port ngrok deployments expose the primary MCP host only (7147). Child workspace listeners (7148+) remain private unless a separate gateway/proxy feature is implemented.'
    - Add operational guidance and validation steps for local/dev and deployed environments, including OIDC proxy endpoints for mobile device-flow auth on the same public hostname.
    technical-details:
    - 'Existing integration points: src/McpServer.Support.Mcp/Services/NgrokTunnelProvider.cs, src/McpServer.Support.Mcp/Options/TunnelOptions.cs, src/McpServer.Support.Mcp/Program.cs.'
    - Current provider starts `ngrok http {Mcp:Tunnel:Port}` and discovers the public URL via the local ngrok API (`http://127.0.0.1:4040/api/tunnels`) using `curl`.
    - 'ngrok auth token handling is already secret-safe in provider startup: token is passed via `NGROK_AUTHTOKEN` environment variable instead of CLI args.'
    - No generic primary-host reverse proxy exists today for child workspace ports; strategy is primary-only public exposure. Use FRP TCP mode for multi-port/child-workspace public access.
    - 'Remote/mobile auth can stay on the same public ngrok hostname via existing OIDC proxy routes: `/auth/config`, `/auth/device`, `/auth/token`, and `/auth/ui/*`.'
    implementation-tasks:
    - task: '[Commit 1 - Strategy] Decide and document single-public-endpoint access model for workspaces when Provider=ngrok (chosen: primary-only exposure; child workspace ports remain private)'
      done: true
    - task: '[Commit 2 - Provider Hardening] Verify NgrokTunnelProvider startup/error/status behavior and add missing timeout/exit diagnostics (including clearer handling when ngrok local API/curl is unavailable)'
      done: true
    - task: '[Commit 3 - Docs] Add docs/Operations/Tunnel-Ngrok.md runbook with appsettings.json examples, token setup, single-port workspace access model, OIDC proxy notes, and public /health validation checklist'
      done: true
  - id: cloudflare-tunnel-strategy
    title: Cloudflare Tunnel strategy for MCP remote/mobile access in single-public-port environments
    estimate: 1-3 days
    note: Cloudflare tunnel provider already exists (CloudflareTunnelProvider). This strategy is the preferred no-open-port path when Cloudflare DNS/Tunnel is available.
    done: true
    description:
    - Use the existing Cloudflare tunnel provider in McpServer.Support.Mcp to expose the primary MCP host endpoint on port 7147.
    - 'Strategy decision: single-host Cloudflare Tunnel deployments expose the primary MCP host only (7147). Child workspace listeners (7148+) remain private unless a separate gateway/proxy feature is implemented.'
    - Produce deployment guidance for cloudflared quick tunnels and named tunnels, including credentials/runtime prerequisites and hostname routing responsibilities.
