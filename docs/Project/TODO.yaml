    - task: '[Commit 1 - MVP] Add startup timeout and clear error reporting in FrpTunnelProvider when frpc does not connect successfully (avoid silent hang/optimistic success)'
      done: true
    - task: '[Commit 1 - MVP] Add provider startup validation/logging in FrpTunnelProvider (sanitized server/port/proxy type) and optional Program.cs log indicating Provider=frp selected'
      done: true
    - task: '[Commit 2 - Hardening] Capture frpc stdout/stderr asynchronously in FrpTunnelProvider, surface actionable errors in TunnelStatus.Error, and log connection lifecycle without exposing secrets'
      done: true
    - task: '[Commit 2 - Hardening] Add FRP option validation in FrpTunnelProvider for incompatible/missing combinations (for example Subdomain + CustomDomain, unsupported ProxyType, missing required values)'
      done: true
    - task: '[Commit 2 - Hardening] Handle frpc process exit after startup and update provider status/error state so GetStatusAsync reports crashes accurately'
      done: true
    - task: '[Commit 3 - Railway Assets] Add infra/frp/railway/Dockerfile to run self-hosted frps on Railway'
      done: true
    - task: '[Commit 3 - Railway Assets] Add infra/frp/railway/entrypoint.sh and frps.toml.template to generate frps runtime config from environment variables (token auth + HTTP vhost mode)'
      done: true
    - task: '[Commit 3 - Railway Assets] Add infra/frp/railway/.env.example and README.md documenting required Railway service variables and exposed ports'
      done: true
    - task: '[Commit 3 - Railway Assets] Optional local parity: add infra/frp/local/docker-compose.frps.yml for local frps validation before Railway deployment'
      done: true
    - task: '[Commit 4 - Tests] Add tests/McpServer.Support.Mcp.Tests/Services/FrpTunnelProviderTests.cs covering config generation, PublicUrl precedence (PublicBaseUrl > CustomDomain > Subdomain), and invalid-option validation'
      done: true
    - task: '[Commit 4 - Tests] Add tests for missing frpc binary / startup failure paths and temp config cleanup behavior in FrpTunnelProvider'
      done: true
    - task: '[Commit 5 - Docs] Add docs/Operations/Tunnel-FRP-Railway.md runbook with Railway frps deployment steps, TCP proxy setup for frps bind port, and MCP appsettings.json examples for Mcp:Tunnel:Provider=frp'
      done: true
    - task: '[Commit 5 - Docs] Add troubleshooting notes (token mismatch, wrong public URL, port mismatch, frpc not found) and an end-to-end validation checklist (/health through FRP public URL)'
      done: true
  - id: ngrok-tunnel-strategy
    title: ngrok tunnel strategy for MCP remote/mobile access in single-public-port environments
    estimate: 1-2 days
    note: ngrok provider already exists (NgrokTunnelProvider). This strategy is the preferred managed-tunnel path when the hosting/network environment does not support exposing multiple public ports.
    done: true
    description:
    - Use the existing ngrok provider in McpServer.Support.Mcp for the primary MCP host endpoint on port 7147.
    - 'Strategy decision: single-public-port ngrok deployments expose the primary MCP host only (7147). Child workspace listeners (7147+) remain private unless a separate gateway/proxy feature is implemented.'
    - Add operational guidance and validation steps for local/dev and deployed environments, including OIDC proxy endpoints for mobile device-flow auth on the same public hostname.
    technical-details:
    - 'Existing integration points: src/McpServer.Support.Mcp/Services/NgrokTunnelProvider.cs, src/McpServer.Support.Mcp/Options/TunnelOptions.cs, src/McpServer.Support.Mcp/Program.cs.'
    - Current provider starts `ngrok http {Mcp:Tunnel:Port}` and discovers the public URL via the local ngrok API (`http://127.0.0.1:4040/api/tunnels`) using `curl`.
    - 'ngrok auth token handling is already secret-safe in provider startup: token is passed via `NGROK_AUTHTOKEN` environment variable instead of CLI args.'
    - No generic primary-host reverse proxy exists today for child workspace ports; strategy is primary-only public exposure. Use FRP TCP mode for multi-port/child-workspace public access.
    - 'Remote/mobile auth can stay on the same public ngrok hostname via existing OIDC proxy routes: `/auth/config`, `/auth/device`, `/auth/token`, and `/auth/ui/*`.'
    implementation-tasks:
    - task: '[Commit 1 - Strategy] Decide and document single-public-endpoint access model for workspaces when Provider=ngrok (chosen: primary-only exposure; child workspace ports remain private)'
      done: true
    - task: '[Commit 2 - Provider Hardening] Verify NgrokTunnelProvider startup/error/status behavior and add missing timeout/exit diagnostics (including clearer handling when ngrok local API/curl is unavailable)'
