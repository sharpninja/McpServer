      ## 7. Public session wire and substitution

      One authenticated socket owns one session, no resume/replay/reconnect execution. UUID epoch/session/invocation; operation UInt64 monotonic from1; independent control sequence. Strict UTF8 JSON camelCase ordinal, reject duplicate/unknown keys/NaN, depth16; 4-byte big-endian size; request1MiB/control16KiB/event64KiB, first-byte partial-frame deadline5s (idle separate), handshake10s. Hello{version:1,profileId,policySha256,selectedStrategy,workspaceId,model nullable,agentName nullable,silent,initialPrompt,timeoutMilliseconds nullable,callerId}; broker maps caller lane by root-approved identity, never public API arbitrary callerId. No target UID/raw executable/env/output-path fields. HelloAck{version,epoch,sessionId,policySha256,strategy,capabilities,workerUid,sequence:0}; caller rejects mismatch before strategy start.

