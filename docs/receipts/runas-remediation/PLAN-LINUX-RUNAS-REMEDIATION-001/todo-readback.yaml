      ## 6. Supervisor, broker-session-invocation protocol and containment

      Broker AgentWorker, session host AgentWorker.Runner, generic invocation runner. Session host uses SAME local CLI strategy and supervised IProcessSpawner/ISpawnedProcess. Broker owns durable registry of generated session/invocation/unit/resource IDs, fsync BEFORE systemd submission or file creation. Session runner sends AllocateInvocation{epoch,sessionId,operationId,launchDigest,resourceNames}; broker derives invocation UUID/unit/lease, saves, replies Allocated. ONLY then session runner invokes systemd-run for exact registered unit; broker monitors Submitted/Ready and sends ReadyApproval after identity. Crash between registration/submission: inspect exact unit AND pending start jobs; absent unit alone not proof. Read errors disable admission. AllocResource/AllocatedResource same registry-first file creation, private dir0700/file0600.

