      3. **Bootstrap the modules and session helpers** — from the repo root, run:

         ```powershell
         pwsh -NoProfile -NonInteractive -File .github/skills/start-mcp-session/scripts/start_mcp_session.ps1 `
           -StartPath . `
           -Agent "Cursor" `
           -Model "<model-id>" `
           -Title "<short session title>" `
           -QueryTitle "<this request title>" `
           -QueryText "<verbatim or paraphrased user request>"
         ```

