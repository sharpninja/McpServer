      ---
      name: start-mcp-session
      description: Bootstrap a new MCP workspace session in any repository that contains `AGENTS-README-FIRST.yaml`, verify server health, fetch fresh `McpSession` and `McpTodo` PowerShell modules from MCP tool search keys `mcp-session-module` and `mcp-todo-module`, refresh the local bootstrap cache, review recent session history and current TODOs, and create the initial session-log turn. Use when the user says `Start Session`, when entering an MCP-managed workspace for the first time, when a 401 or server restart requires re-bootstrap, or when you need a repeatable session start workflow without importing helper modules from local file paths or trusting an old cached module copy.
      ---

      # Start MCP Session

      Use the bundled script to perform the bootstrap sequence consistently.

      ## Startup Flow

      ![Session startup activity diagram](assets/session-startup-activity.png)
      Source: `assets/session-startup-activity.mmd`

      - Resolve the workspace by searching upward for `AGENTS-README-FIRST.yaml`.
      - Deserialize the marker file as YAML before any other action and read workspace metadata from the resulting object.
      - Search the MCP tool registry for keys `mcp-session-module` and `mcp-todo-module`.
      - Refresh `.mcpServer/bootstrap-modules` from those tool results on every bootstrap before importing either module.
      - Keep the fresh local cache for follow-on session and todo work, but never treat the previous cache contents as authoritative.
      - Prefer explicit timestamped `RequestId` values instead of implicit `req-001`.
      - Keep `Agent`, `SourceType`, and the `sessionId` prefix identical and case-sensitive.
      - If `.mcpServer/session.yaml` points at a cached session with status `completed` or `closed`, delete that cache before initializing the session module so bootstrap starts a fresh session.

      ## Quick Start

      Run the helper script from anywhere under the workspace:

      ```powershell
      pwsh -NonInteractive -File scripts/start_mcp_session.ps1 `
        -Agent "Codex" `
        -Model "gpt-5-codex" `
        -Title "Session bootstrap and current task" `
        -QueryTitle "Start Session" `
        -QueryText "Start Session"
      ```

      The script:

      1. Finds the active workspace by locating `AGENTS-README-FIRST.yaml`
      2. Reads the marker and verifies `/health`
      3. Searches `/mcpserver/tools/search?keyword=mcp-session-module` and `/mcpserver/tools/search?keyword=mcp-todo-module`
      4. Refreshes `.mcpServer/bootstrap-modules` with fresh `McpSession.psm1` and `McpTodo.psm1` copies from those tool results, including parameterized `commandTemplate` downloads when needed
      5. Deletes a cached closed session state from `.mcpServer/session.yaml` before initializing the session module
      6. Reviews recent session history and current TODOs
      7. Creates a new session log and initial turn
      8. Returns JSON with workspace, tool match details, cache paths, session/turn IDs, and TODO/session previews

      If the current MCP server does not publish either tool entry, or the tool result cannot be turned into a downloaded module file, the script fails clearly. Do not fall back to repo file paths or a stale cached local copy.

      ## Tool Search

      By default the script searches for these exact keys:

      - `mcp-session-module`
      - `mcp-todo-module`

      Override them when a workspace publishes different registry keys:

      ```powershell
      pwsh -NonInteractive -File scripts/start_mcp_session.ps1 `
        -Agent "Codex" `
        -Model "gpt-5-codex" `
        -Title "Bootstrap session" `
        -SessionToolSearchKey "custom-session-module-key" `
        -TodoToolSearchKey "custom-todo-module-key"
      ```

      Read [references/session-flow.md](references/session-flow.md) when you need the manual turn lifecycle, the direct tool-search bootstrap pattern, or failure recovery details.

      ## Follow-On Turns

      Within the same PowerShell process, keep using the already imported modules. The script also refreshes `.mcpServer/bootstrap-modules`, so follow-on todo work can import the just-downloaded cache in the current workspace. If you hit a 401 or the server restarts, rerun the helper so the cache is refreshed again before reuse.

      ```powershell
      $result = pwsh -NonInteractive -File scripts/start_mcp_session.ps1 `
        -Agent "Codex" `
        -Model "gpt-5-codex" `
        -Title "Session bootstrap and current task" `
        -QueryTitle "Start Session" `
        -QueryText "Start Session" | ConvertFrom-Json

      Import-Module $result.sessionModulePath -Force
      Import-Module $result.todoModulePath -Force
      Initialize-McpSession -Agent "Codex" -Model "gpt-5-codex" -MarkerPath .\AGENTS-README-FIRST.yaml
      Initialize-McpTodo -MarkerPath .\AGENTS-README-FIRST.yaml

      $requestId = "req-$((Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ'))-next-task"
      $turn = Add-McpSessionTurn `
        -RequestId $requestId `
        -QueryTitle "Implement feature" `
        -QueryText "Implement feature" `
        -Status "in_progress"

      $todos = Get-McpTodo
      ```

      If the downloaded session module only exposes the legacy `Add-McpSessionEntry` API, use that compatibility surface instead. The bundled script handles both shapes automatically.

      ## Guardrails

      - Do not write TODO files directly.
      - Do not import `McpSession.psm1` or `McpTodo.psm1` from a local repo path when the goal is server-driven bootstrap.
      - Do not trust an existing `.mcpServer/bootstrap-modules` cache. Refresh it from tool search every bootstrap run before reuse.
