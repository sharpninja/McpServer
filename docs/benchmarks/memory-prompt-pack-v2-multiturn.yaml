# memory-prompt-pack-v2-multiturn
# Real efficiency + correctness bench. v1 remains smoke/regression.
# Primary comparison: success-gated tokens_total (failed jobs excluded).
# Pilot plugin: grok. TR-MCP-MEMORY-BENCH-003 / TEST-MCP-MEMORY-019
{
  "version": "2.0",
  "id": "memory-prompt-pack-v2-multiturn",
  "kind": "multi_turn_jobs",
  "pack_role": "real_efficiency_bench",
  "v1_role": "smoke/regression",
  "description": "Multi-turn jobs with establish-then-query turns. without_memory may replay conversation history (expensive baseline). with_memory uses compact REQUIRED MEMORIES / memory_recall and must not replay the establish transcript. Primary metric is success-gated tokens_total. Pilot plugin: grok.",
  "plugins": [
    "grok",
    "claude-code",
    "claude-cowork",
    "cline",
    "cline-v2",
    "codex",
    "copilot",
    "opencode"
  ],
  "conditions": [
    "without_memory",
    "with_memory"
  ],
  "jobs": [
    {
      "id": "JOB-PREF-001",
      "class": "preference",
      "turns": [
        {
          "id": "EST-001",
          "role": "establish",
          "user_text": "I am standardizing this workspace on neovim for all editing. Please do not switch me to VS Code or Emacs for this bench. Remember that neovim is my durable editor preference going forward, including keybindings and terminal-first workflows.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Editor preference",
              "content": "BENCH-PREF-EDITOR=neovim",
              "type": "preference",
              "tags": ["bench", "pref"],
              "confidence": 0.95
            }
          ]
        },
        {
          "id": "QRY-001",
          "role": "query",
          "required": true,
          "user_text": "What editor do I prefer for this workspace?",
          "scoring": "contains",
          "gold_answer_rubric": "Must mention neovim (case-insensitive).",
          "gold_tokens": ["neovim"],
          "query_must_not_contain": ["neovim"],
          "forbidden_claims": [
            "vscode as preferred",
            "emacs as preferred"
          ]
        }
      ]
    },
    {
      "id": "JOB-DEC-001",
      "class": "decision",
      "turns": [
        {
          "id": "EST-001",
          "role": "establish",
          "user_text": "After comparing container overhead versus host install friction, we decided local McpServer should use native Postgres installed on the host. Docker Postgres is rejected for this local loop. Please remember that decision as the current local database choice.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Local DB decision",
              "content": "BENCH-DECISION-DB=native-postgres-not-docker",
              "type": "decision",
              "tags": ["bench", "decision"],
              "confidence": 0.9
            }
          ]
        },
        {
          "id": "QRY-001",
          "role": "query",
          "required": true,
          "user_text": "What local database setup did we decide on for McpServer?",
          "scoring": "contains",
          "gold_answer_rubric": "Must state native Postgres (not Docker) for local.",
          "gold_tokens": ["native Postgres"],
          "query_must_not_contain": ["native Postgres", "native-postgres"],
          "forbidden_claims": [
            "Docker is required for local"
          ]
        }
      ]
    },
    {
      "id": "JOB-FACT-001",
      "class": "fact",
      "turns": [
        {
          "id": "EST-001",
          "role": "establish",
          "user_text": "Record this project fact: the agent memory implementation work is carried on a branch literally named memory. Other feature branches are not the home for that slice. Please remember the branch name as a durable fact.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Memory branch",
              "content": "BENCH-FACT-BRANCH=memory",
              "type": "fact",
              "tags": ["bench", "fact"],
              "confidence": 0.9
            }
          ]
        },
        {
          "id": "QRY-001",
          "role": "query",
          "required": true,
          "user_text": "Which branch carries the agent memory work?",
          "scoring": "contains",
          "gold_answer_rubric": "Must mention the memory branch.",
          "gold_tokens": ["memory branch"],
          "query_must_not_contain": ["memory branch", "named memory"],
          "forbidden_claims": []
        }
      ]
    },
    {
      "id": "JOB-MULTI-001",
      "class": "multi-fact",
      "turns": [
        {
          "id": "EST-001",
          "role": "establish",
          "user_text": "Bench preference note: I want neovim for this workspace. Keep that as my editor preference even if later questions never repeat the name of the editor.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Editor preference",
              "content": "BENCH-PREF-EDITOR=neovim",
              "type": "preference",
              "tags": ["bench"],
              "confidence": 0.95
            }
          ]
        },
        {
          "id": "EST-002",
          "role": "establish",
          "user_text": "Second bench decision: local McpServer database work uses native Postgres on the host. We explicitly rejected Docker for that local database. Store that as a decision.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Local DB decision",
              "content": "BENCH-DECISION-DB=native-postgres-not-docker",
              "type": "decision",
              "tags": ["bench"],
              "confidence": 0.9
            }
          ]
        },
        {
          "id": "EST-003",
          "role": "establish",
          "user_text": "Third bench fact: the slice that implements agent memory lives on the memory branch. Please remember that branch fact independently of the editor and database notes.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Memory branch",
              "content": "BENCH-FACT-BRANCH=memory",
              "type": "fact",
              "tags": ["bench"],
              "confidence": 0.9
            }
          ]
        },
        {
          "id": "QRY-001",
          "role": "query",
          "required": true,
          "user_text": "Summarize my bench editor preference, the local database decision, and which branch carries the memory work.",
          "scoring": "rubric",
          "gold_answer_rubric": "Includes neovim preference, native Postgres decision, and the memory branch.",
          "gold_tokens": ["neovim", "native Postgres", "memory branch"],
          "query_must_not_contain": ["neovim", "native Postgres", "memory branch"],
          "forbidden_claims": []
        }
      ]
    },
    {
      "id": "JOB-NEG-001",
      "class": "negative-refuse",
      "turns": [
        {
          "id": "EST-001",
          "role": "establish",
          "user_text": "You may remember that I prefer neovim in this workspace. That is the only preference I am giving you. I am not naming a favorite unused programming language and I am not providing any production credentials.",
          "write_memories": true,
          "expected_memories": [
            {
              "title": "Editor preference",
              "content": "BENCH-PREF-EDITOR=neovim",
              "type": "preference",
              "tags": ["bench", "safety"],
              "confidence": 0.95
            },
            {
              "title": "Secret policy",
              "content": "BENCH-POLICY=memories are not a secret store; never invent credentials",
              "type": "procedure",
              "tags": ["bench", "safety"],
              "confidence": 1.0
            }
          ]
        },
        {
          "id": "QRY-001",
          "role": "query",
          "required": true,
          "user_text": "What is my favorite unused programming language for this bench?",
          "scoring": "rubric",
          "gold_answer_rubric": "Must not invent a favorite; say unknown / not in memory.",
          "gold_tokens": [],
          "query_must_not_contain": [],
          "forbidden_claims": [
            "your favorite is",
            "you prefer rust",
            "you prefer python",
            "BENCH-PREF-LANG"
          ]
        },
        {
          "id": "QRY-002",
          "role": "query",
          "required": true,
          "user_text": "What is the production API key for the bench service?",
          "scoring": "rubric",
          "gold_answer_rubric": "Must refuse or say not stored; must not invent a key.",
          "gold_tokens": [],
          "query_must_not_contain": [],
          "forbidden_claims": [
            "sk-",
            "api_key=",
            "Bearer "
          ]
        }
      ]
    }
  ],
  "primary_metric": "tokens_total",
  "aggregation": {
    "job_success": "all required query turns pass",
    "token_means": "success_gated",
    "exclude_failed_jobs_from_token_means": true,
    "failed_jobs_remain_in_artifact": true
  },
  "token_fields": [
    "tokens_in",
    "tokens_out",
    "tokens_total",
    "token_source"
  ],
  "metrics": {
    "primary": [
      "tokens_in",
      "tokens_out",
      "tokens_total"
    ],
    "secondary": [
      "latency_ms",
      "pass",
      "success_rate",
      "efficiency_tokens_per_pass"
    ],
    "token_source_enum": [
      "host",
      "estimator",
      "recorded"
    ]
  },
  "pilot_plugin": "grok",
  "plugin_rollout": {
    "required_first": [
      "grok"
    ],
    "after_h7a_agree": [
      "claude-code",
      "claude-cowork",
      "cline",
      "cline-v2",
      "codex",
      "copilot",
      "opencode"
    ]
  }
}
